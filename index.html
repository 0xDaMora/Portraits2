<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retratos procedurales</title>
<style>
  :root {
    --bg: #14110f;
    --panel: #1e1a17;
    --ink: #e8dcc8;
    --muted: #a3927a;
    --accent: #d08a3c;
    --frame: #5a4632;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #231d18, var(--bg) 70%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-weight: normal; letter-spacing: 0.08em; margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 0 0 24px; font-style: italic; }
  .hero { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .frame {
    padding: 10px;
    background: linear-gradient(135deg, #6b543b, #3a2c1f 40%, #6b543b 60%, #2e2318);
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,220,170,0.15);
  }
  .frame canvas { display: block; width: 100%; height: auto; border: 1px solid #000; }
  #main { width: min(400px, 100%); }
  .side { flex: 1; min-width: 260px; }
  .name { font-size: 1.8rem; margin: 0 0 4px; letter-spacing: 0.04em; }
  .race { color: var(--accent); margin: 0 0 16px; text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.8rem; }
  label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .selects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin-bottom: 16px; }
  input, select {
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--frame); border-radius: 3px;
    padding: 8px 10px; font: inherit; width: 100%;
  }
  input { flex: 1; min-width: 140px; width: auto; }
  button {
    background: #3a2c1f; color: var(--ink);
    border: 1px solid var(--frame); border-radius: 3px;
    padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button:hover { background: #4a3827; border-color: var(--accent); }
  ul.traits { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  ul.traits li { background: var(--panel); border: 1px solid var(--frame); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; }
  .preset-tag { display: none; margin-bottom: 12px; font-size: 0.85rem; color: var(--accent); }
  .preset-tag button { font-size: 0.75rem; padding: 2px 8px; margin-left: 6px; }
  h2 { font-weight: normal; letter-spacing: 0.08em; margin: 40px 0 12px; font-size: 1.1rem; color: var(--muted); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .thumb { cursor: pointer; padding: 5px; transition: transform 0.15s; }
  .thumb:hover { transform: translateY(-3px); }
  .thumb .seed { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { color: #ff8a7a; }
</style>
</head>
<body>
<main>
  <h1>Retratos procedurales</h1>
  <p class="sub">Misma semilla, mismo personaje. Todo se pinta con un shader de ruido, sin imágenes.</p>

  <div class="hero">
    <div class="frame" id="main"><canvas id="big" width="512" height="640"></canvas></div>
    <div class="side">
      <p class="name" id="name">—</p>
      <p class="race" id="race"></p>
      <div class="preset-tag" id="presetTag">Preset: <span id="presetName"></span><button id="clearPreset">Quitar</button></div>
      <label for="seed">Semilla</label>
      <div class="row">
        <input id="seed" autocomplete="off">
        <button id="go">Generar</button>
        <button id="rand">Aleatorio</button>
        <button id="dl">PNG</button>
      </div>
      <div class="selects">
        <div><label for="selRace">Raza</label>
          <select id="selRace"><option value="">Aleatoria</option><option value="human">Humano</option><option value="elf">Elfo</option><option value="dragon">Dragonoide</option><option value="duende">Duende</option></select></div>
        <div><label for="selSex">Sexo</label>
          <select id="selSex"><option value="">Aleatorio</option><option value="f">Mujer</option><option value="m">Hombre</option></select></div>
        <div><label for="selAge">Edad</label>
          <select id="selAge"><option value="">Aleatoria</option><option value="young">Joven</option><option value="adult">Adulto</option><option value="old">Anciano</option></select></div>
        <div><label for="selCls">Clase</label>
          <select id="selCls"><option value="">Aleatoria</option><option value="mage">Mago</option><option value="warrior">Guerrero</option><option value="ranger">Explorador</option><option value="survivor">Superviviente</option></select></div>
        <div><label for="selHair">Peinado</label><select id="selHair"><option value="">Aleatorio</option></select></div>
        <div><label for="selHat">Sombrero</label><select id="selHat"><option value="">Aleatorio</option></select></div>
      </div>
      <ul class="traits" id="traits"></ul>
    </div>
  </div>

  <h2>Maga de pelo rosa: corte hime, túnica azul y boina morada</h2>
  <div class="gallery" id="presetGallery"></div>

  <h2>Dragonoides</h2>
  <div class="gallery" id="dragonGallery"></div>

  <h2>Otras semillas <button id="more" style="margin-left:8px;font-size:0.8rem;padding:4px 10px">Más</button></h2>
  <div class="gallery" id="gallery"></div>
</main>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uSeed;
uniform vec3 uSkin, uHair, uCloth, uTrim, uHat, uBg, uEye, uEye2, uLight, uPaint, uMetal, uLeather, uMagic, uLip, uHorn, uFur, uScale, uAcc, uLacq;
uniform vec4 uQ[13];

#define HEAD_W uQ[0].x
#define HEAD_H uQ[0].y
#define JAW uQ[0].z
#define EYE_SEP uQ[0].w
#define EYE_SIZE uQ[1].x
#define FRINGE uQ[1].y
#define HAIR_LEN uQ[1].z
#define BEARD uQ[1].w
#define SCAR uQ[2].x
#define MARK uQ[2].y
#define LIGHT_ANG uQ[2].z
#define BROW_TILT uQ[2].w
#define MOUTH_W uQ[3].x
#define EAR uQ[3].y
#define GLOW_EYES uQ[3].z
#define PART uQ[3].w
#define MOUTH_CURVE uQ[4].x
#define HAIR_VOL uQ[4].y
#define FEMALE uQ[4].z
#define AGE uQ[4].w
#define RACE uQ[5].x
#define OUTFIT uQ[5].y
#define HAT uQ[5].z
#define PROP uQ[5].w
#define AMULET uQ[6].x
#define EARRINGS uQ[6].y
#define NOSE uQ[6].z
#define BODY_W uQ[6].w
#define HORNS uQ[7].x
#define FRECKLES uQ[7].y
#define HAT_TILT uQ[7].z
#define PROP_SIDE uQ[7].w
#define FUR uQ[8].x
#define SIDE_LEN uQ[8].y
#define SIDE_IN uQ[8].z
#define BACK uQ[8].w
#define EXTRA uQ[9].x
#define AHOGE uQ[9].y
#define ORNAMENT uQ[9].z
#define EYE_SHAPE uQ[9].w
#define PUPIL uQ[10].x
#define EYEPATCH uQ[10].y
#define GLASSES uQ[10].z
#define MASK uQ[10].w
#define SCARF uQ[11].x
#define SCALES uQ[11].y
#define FANG uQ[11].z
#define MOLE uQ[11].w
#define PATTERN uQ[12].x

bool eq(float v, float k) { return abs(v - k) < 0.5; }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453);
}
float hash1(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(dot(hash2(i), f), dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
             mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)), dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}
float tri(float x) { return abs(fract(x) - 0.5) * 2.0; }
// x: distance to the nearest cell edge, y: random id of the cell
vec2 voro(vec2 p) {
  vec2 n = floor(p), f = fract(p);
  float m1 = 8.0, m2 = 8.0, id = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 o = 0.5 + 0.35 * hash2(n + g);
    vec2 r = g + o - f;
    float d = dot(r, r);
    if (d < m1) { m2 = m1; m1 = d; id = hash1(n + g); } else if (d < m2) { m2 = d; }
  }
  return vec2(sqrt(m2) - sqrt(m1), id);
}
// Seigaiha wave pattern: returns ring-line intensity.
float seig(vec2 p) {
  float jb = floor(p.y / 0.25);
  for (int k = 0; k < 3; k++) {
    float j = jb - 2.0 + float(k);
    float off = 0.5 * mod(j, 2.0);
    float cx = floor(p.x - off + 0.5) + off;
    float r = length(p - vec2(cx, j * 0.25));
    if (r < 0.5) return smoothstep(0.6, 0.85, tri(r * 8.0));
  }
  return 0.0;
}
float sdE(vec2 p, vec2 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-5);
}
float sdTaper(vec2 p, vec2 a, vec2 b, float ra, float rb) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}
float sdRhomb(vec2 p, vec2 r) { return (abs(p.x) / r.x + abs(p.y) / r.y - 1.0) * min(r.x, r.y) * 0.7; }
float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
float sdFlower(vec2 p, float r, float k) { float a = atan(p.y, p.x); return length(p) - r * (0.6 + 0.4 * cos(a * k)); }
float sdStar5(vec2 p, float r) { float a = atan(p.x, p.y); float k = 0.5 + 0.5 * cos(a * 5.0); return length(p) - r * mix(0.42, 1.0, k * k * k); }
float fill(float d, float s) { return smoothstep(s, -s, d); }
float band(float v, float a, float b) { return smoothstep(a - 0.0015, a + 0.0015, v) * smoothstep(b + 0.0015, b - 0.0015, v); }
vec3 ellN(vec2 q, vec2 r) {
  vec2 k = q / r;
  float z = sqrt(max(0.0, 1.0 - dot(k, k)));
  return normalize(vec3(k * 0.85, z + 0.2));
}

// Semi-posterized wrap lighting: warm lights, cool shadows, brushy band edges.
vec3 shade(vec3 base, vec3 n, vec3 L, float jit) {
  float d = clamp(dot(n, L), -1.0, 1.0) * 0.5 + 0.5;
  float bands = floor(d * 4.0 + jit) / 4.0;
  d = mix(d, bands, 0.55);
  vec3 shadow = base * vec3(0.30, 0.29, 0.42) + uBg * 0.07;
  vec3 lit = base * 1.06 + uLight * base * 0.4;
  return mix(shadow, lit, smoothstep(0.0, 1.0, d));
}
vec3 metal(vec3 base, vec3 n, vec3 L, float jit) {
  float d = max(dot(n, L), 0.0);
  d = mix(d, floor(d * 4.0 + jit) / 4.0, 0.5);
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float s = pow(max(dot(n, H), 0.0), 28.0);
  return base * (0.16 + 0.8 * d) + uBg * 0.35 * (1.0 - n.z) + uLight * s * 0.9;
}
vec3 gem(vec2 gq, vec3 L) {
  vec3 n = normalize(vec3(sign(gq.x) * 0.6, sign(gq.y) * 0.4, 1.0));
  return uMagic * (0.5 + 0.7 * max(dot(n, L), 0.0)) + 0.35 * exp(-length(gq) / 0.006);
}
// Lacquered lamellar plates laced with coloured cords (samurai armour).
vec3 lamellar(vec2 uv, vec3 n, vec3 L, float jit) {
  float row = fract(uv.y * 26.0);
  vec3 c = metal(uLacq, n, L, jit) * (0.8 + 0.3 * row);
  float cord = step(abs(fract(uv.x * 40.0) - 0.5), 0.13) * step(0.25, row) * step(row, 0.75);
  c = mix(c, shade(uAcc, n, L, jit), cord * 0.85);
  return c * (1.0 - 0.5 * smoothstep(0.85, 1.0, row));
}
vec3 scaleSkin(vec3 c, vec2 uv, float m, vec3 n, vec3 L, float jit) {
  if (m <= 0.001) return c;
  vec2 v = voro(uv);
  vec3 base = mix(c, uScale, 0.75);
  vec3 sc = base * (0.62 + 0.5 * smoothstep(0.0, 0.4, v.x)) * (0.9 + 0.2 * v.y);
  sc += uLight * 0.1 * smoothstep(0.25, 0.5, v.x) * max(dot(n, L), 0.0);
  return mix(c, sc, m);
}
float hornD(vec2 q, vec2 h0, vec2 h1, vec2 h2, vec3 r, float sx, bool antler) {
  float d = min(sdTaper(q, h0, h1, r.x, r.y), sdTaper(q, h1, h2, r.y, r.z));
  if (antler) {
    d = min(d, sdTaper(q, h1, h1 + vec2(sx * 0.06, 0.045), 0.006, 0.0015));
    vec2 hm = mix(h1, h2, 0.55);
    d = min(d, sdTaper(q, hm, hm + vec2(-sx * 0.03, 0.05), 0.005, 0.0012));
    d = min(d, sdTaper(q, hm, hm + vec2(sx * 0.05, 0.03), 0.005, 0.0012));
  }
  return d;
}
float sdBow(vec2 p, float s) {
  vec2 a = vec2(abs(p.x), p.y);
  float loop = sdE(rot(-0.35) * (a - vec2(0.022, 0.004) * s), vec2(0.022, 0.013) * s);
  float knot = length(p) - 0.007 * s;
  float tail = sdTaper(a, vec2(0.004, -0.004) * s, vec2(0.016, -0.03) * s, 0.005 * s, 0.003 * s);
  return min(min(loop, knot), tail);
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 0.84;
  vec2 so = vec2(uSeed * 1.37, uSeed * 2.91);

  vec2 w = vec2(fbm(p * 7.0 + so), fbm(p * 7.0 + so + 5.2));
  vec2 q = p + w * 0.012;
  float ang = fbm(p * 2.2 + so) * 3.14;
  float stroke = noise((rot(ang) * p) * vec2(110.0, 10.0) + so);
  float jit = 0.5 + 0.6 * fbm(p * 14.0 + so * 1.3) + 0.25 * stroke;

  vec3 L = normalize(vec3(cos(LIGHT_ANG), sin(LIGHT_ANG), 0.75));
  float soft = 0.0022;
  vec3 addGlow = vec3(0.0);

  // ---- background
  vec2 bw = p * 2.4 + so;
  float b1 = fbm(bw + 1.6 * vec2(fbm(bw), fbm(bw + vec2(5.2, 1.3))));
  vec3 col = mix(uBg * 0.18, uBg * 0.95, smoothstep(-0.35, 0.55, b1));
  col += uLight * 0.4 * exp(-3.2 * length(p - L.xy * 0.3 - vec2(0.0, 0.05)));
  col *= 0.94 + 0.12 * stroke;

  vec2 hc = vec2(0.0, 0.05);
  vec2 hr = vec2(0.128 * HEAD_W, 0.172 * HEAD_H);
  vec2 fq = q - hc;
  vec2 hq = fq;
  hq.x /= 1.0 - JAW * smoothstep(0.0, -0.18, hq.y);
  float dHead = sdE(hq, hr);
  bool hood = eq(HAT, 3.0);
  bool helmet = eq(HAT, 5.0);
  bool topCovered = hood || helmet || eq(HAT, 8.0) || eq(HAT, 10.0);
  bool hasHair = FRINGE > -0.5;
  float PS = PROP_SIDE;
  float BW = BODY_W;
  float es = EYE_SEP, esz = EYE_SIZE;
  float pside = PART > 0.0 ? 1.0 : -1.0;

  vec2 hoodR = hr * vec2(1.6, 1.33);
  float dHoodOuter = min(sdE(fq - vec2(0.0, 0.015), hoodR),
                         sdE(fq - vec2(0.0, -0.12), vec2(hr.x * 1.75, 0.2)));
  dHoodOuter += 0.006 * fbm(q * 12.0 + so);

  // ---- props behind the body
  if (eq(PROP, 2.0)) {
    // sword hilt over the shoulder
    vec2 a = vec2(PS * 0.2, -0.24), b = vec2(PS * 0.27, -0.07);
    vec2 dir = normalize(b - a), perp = vec2(-dir.y, dir.x);
    float t = dot(q - a, dir);
    float s = dot(q - a, perp);
    vec3 gc = uLeather * (0.7 + 0.5 * step(0.5, fract(t * 90.0)));
    gc = shade(gc, normalize(vec3(perp * s / 0.011 * 0.8, 0.6)), L, jit);
    col = mix(col, gc, fill(sdTaper(q, a, b, 0.011, 0.01), soft));
    col = mix(col, metal(uMetal, normalize(vec3(perp * s * 30.0, 1.0)), L, jit),
              fill(sdTaper(q, a - perp * 0.055, a + perp * 0.055, 0.009, 0.009), soft));
    vec2 pc = b + dir * 0.012;
    col = mix(col, metal(uMetal, normalize(vec3((q - pc) / 0.017, 0.6)), L, jit), fill(length(q - pc) - 0.017, soft));
  }
  if (eq(PROP, 4.0)) {
    // katana: diamond-wrapped tsuka, oval tsuba, metal kashira
    vec2 a = vec2(PS * 0.19, -0.23), b = vec2(PS * 0.29, -0.02);
    vec2 dir = normalize(b - a), perp = vec2(-dir.y, dir.x);
    float t = dot(q - a, dir), s = dot(q - a, perp);
    float dia = min(abs(fract((t + s) * 70.0) - 0.5), abs(fract((t - s) * 70.0) - 0.5));
    vec3 tc = mix(uAcc * 0.55, vec3(0.88, 0.85, 0.78), smoothstep(0.28, 0.36, dia));
    tc = shade(tc, normalize(vec3(perp * s / 0.0095 * 0.8, 0.6)), L, jit);
    col = mix(col, tc, fill(sdTaper(q, a, b, 0.0095, 0.009), soft));
    col = mix(col, metal(uMetal, normalize(vec3(perp * s / 0.01, 0.7)), L, jit), fill(sdTaper(q, b - dir * 0.004, b + dir * 0.01, 0.0105, 0.009), soft));
    vec2 tq = vec2(s, t);
    col = mix(col, metal(uMetal * 0.8, normalize(vec3(perp * tq.x / 0.032, 0.8)), L, jit), fill(sdE(tq, vec2(0.032, 0.006)), soft));
  }
  if (eq(PROP, 3.0)) {
    vec2 a = vec2(PS * 0.16, -0.36), b = vec2(PS * 0.3, -0.06);
    vec2 dir = normalize(b - a), perp = vec2(-dir.y, dir.x);
    for (int i = 0; i < 4; i++) {
      float fi = float(i);
      vec2 s0 = b + perp * (fi - 1.5) * 0.014;
      vec2 s1 = s0 + dir * (0.07 + 0.012 * mod(fi * 7.0, 3.0));
      col = mix(col, uLeather * 1.4, fill(sdTaper(q, s0, s1, 0.0025, 0.0025), soft));
      vec3 fc = mix(uPaint, vec3(0.85, 0.82, 0.75), step(0.5, mod(fi, 2.0)));
      fc *= 0.8 + 0.3 * noise(q * 300.0);
      col = mix(col, shade(fc, vec3(0.0, 0.3, 0.95), L, jit), fill(sdTaper(q, s1 - dir * 0.035, s1, 0.0075, 0.0015), soft));
    }
    float t = dot(q - a, dir) / length(b - a);
    vec3 qn = normalize(vec3(perp * dot(q - a, perp) / 0.04, 0.7));
    vec3 qc = shade(uLeather, qn, L, jit) * (0.9 + 0.15 * stroke);
    qc = mix(qc, metal(uMetal, qn, L, jit), step(abs(t - 0.95), 0.03));
    col = mix(col, qc, fill(sdTaper(q, a, b, 0.036, 0.04), soft));
  }
  if (eq(PROP, 5.0)) {
    // longbow across the back
    vec2 bq = q - vec2(PS * 0.1, -0.02);
    vec2 rr = vec2(0.15, 0.33);
    float d = abs(sdE(bq, rr)) - 0.0085 * (1.0 - 0.55 * abs(bq.y) / rr.y);
    d = max(max(d, -PS * bq.x), abs(bq.y) - 0.315);
    float ds = max(abs(bq.x - PS * 0.045) - 0.0012, abs(bq.y) - 0.315);
    col = mix(col, vec3(0.8, 0.77, 0.7) * 0.7, fill(ds, 0.0008));
    vec3 wc = uLeather * 1.3 * (0.85 + 0.25 * noise(q * vec2(30.0, 300.0)));
    col = mix(col, shade(wc, normalize(vec3(PS * 0.5, 0.2, 0.8)), L, jit), fill(d, soft));
  }
  if (eq(PROP, 6.0)) {
    // round shield slung on the back
    vec2 sq = q - vec2(PS * 0.2, -0.17);
    float d = length(sq) - 0.2;
    vec3 wood = uLeather * 1.2 * (0.8 + 0.3 * step(0.5, fract(sq.x * 22.0))) * (0.9 + 0.2 * noise(vec2(sq.x * 40.0, sq.y * 300.0)));
    vec3 face = mix(wood, uCloth * 1.1, step(0.0, sq.x * sq.y) * 0.85);
    vec3 sn = normalize(vec3(sq / 0.2 * 0.5, 1.0));
    vec3 c = shade(face, sn, L, jit);
    c = mix(c, metal(uMetal, sn, L, jit), fill(abs(d + 0.01) - 0.01, 0.0015));
    float ra = atan(sq.y, sq.x);
    float rv = length(vec2((fract(ra * 1.9099) - 0.5) * 0.105, length(sq) - 0.19)) - 0.005;
    c = mix(c, metal(uMetal * 1.2, sn, L, jit) + 0.1, fill(rv, 0.001));
    col = mix(col, c * 0.85, fill(d, soft));
  }
  if (eq(PROP, 9.0)) {
    // bearded axe over the shoulder
    vec2 a = vec2(PS * 0.2, -0.3), b = vec2(PS * 0.25, 0.03);
    vec3 hc9 = shade(uLeather * 1.2, vec3(PS * 0.4, 0.0, 0.9), L, jit) * (0.85 + 0.25 * noise(q * vec2(300.0, 20.0)));
    col = mix(col, hc9, fill(sdTaper(q, a, b + vec2(0.0, 0.02), 0.009, 0.008), soft));
    vec2 aq = q - (b + vec2(PS * 0.004, -0.01));
    float dE9 = sdE(aq, vec2(0.055, 0.058));
    float dBlade = max(dE9, -PS * aq.x);
    dBlade = max(dBlade, -sdE(aq - vec2(PS * 0.004, -0.07), vec2(0.04, 0.045)));
    vec3 bc9 = metal(uMetal, normalize(vec3(PS * 0.3, 0.3, 0.9)), L, jit);
    bc9 += 0.25 * fill(abs(dE9) - 0.005, 0.002);
    col = mix(col, bc9, fill(dBlade, soft));
  }

  // ---- hood back / hair behind the head
  if (hood) {
    vec3 c = shade(uCloth * 0.8, ellN(fq - vec2(0.0, 0.015), hoodR), L, jit);
    col = mix(col, c * 0.7, fill(dHoodOuter, soft));
  } else if (hasHair) {
    if (eq(BACK, 2.0)) {
      // straight curtain with a blunt cut
      float wdt = hr.x * 1.32 * HAIR_VOL;
      float bottom = hc.y - 0.22 - 0.16 * HAIR_LEN + 0.004 * noise(vec2(q.x * 50.0, 0.0) + so);
      float d = min(sdE(fq - vec2(0.0, 0.02), vec2(wdt, hr.y * 1.08)),
                    max(abs(q.x) - wdt, max(q.y - hc.y - 0.02, bottom - q.y)));
      vec2 fl = vec2(q.x * 70.0 + fbm(q * 6.0 + so) * 2.0, q.y * 3.0);
      float strand = 0.6 * noise(fl + so) + 0.4 * noise(fl * vec2(3.0, 2.0) + so);
      vec3 n = normalize(vec3(q.x / wdt * 0.8, 0.0, 1.0));
      vec3 c = shade(uHair * (0.75 + 0.5 * strand), n, L, jit) * 0.62;
      col = mix(col, c, fill(d, soft));
    } else if (eq(BACK, 1.0)) {
      vec2 c0 = hc + vec2(0.0, -0.07 * HAIR_LEN);
      vec2 rr = vec2(hr.x * 1.3 * HAIR_VOL, hr.y * 1.08 + 0.14 * HAIR_LEN);
      float d = sdE(q - c0, rr) + 0.012 * fbm(q * vec2(40.0, 5.0) + so);
      vec2 fl = vec2(q.x * 50.0 + fbm(q * 5.0 + so) * 4.0, q.y * 4.0);
      float strand = 0.6 * noise(fl + so) + 0.4 * noise(fl * vec2(3.0, 2.0) + so);
      vec3 c = shade(uHair * (0.75 + 0.5 * strand), ellN(q - c0, rr), L, jit) * 0.7;
      col = mix(col, c, fill(d, soft));
    } else if (eq(BACK, 3.0)) {
      // bob: rounded, curling under at the chin
      float wdt = hr.x * 1.3 * HAIR_VOL;
      float d = max(sdE(fq - vec2(0.0, -0.005), vec2(wdt, hr.y * 1.12)), -0.125 - fq.y + 0.003 * noise(vec2(q.x * 60.0, 0.0) + so));
      vec2 fl = vec2(q.x * 70.0 + fbm(q * 6.0 + so) * 2.0, q.y * 3.0);
      float strand = 0.6 * noise(fl + so) + 0.4 * noise(fl * vec2(3.0, 2.0) + so);
      vec3 c = shade(uHair * (0.75 + 0.5 * strand), ellN(fq, vec2(wdt, hr.y * 1.12)), L, jit) * 0.65;
      col = mix(col, c, fill(d, soft));
    }
    if (eq(EXTRA, 4.0)) {
      // high ponytail falling to one side
      vec2 t0 = hc + vec2(0.0, hr.y * 0.95);
      vec2 t1 = t0 + vec2(pside * 0.09, 0.05);
      vec2 t2 = t0 + vec2(pside * 0.2, -0.2 - 0.12 * HAIR_LEN);
      float d = min(sdTaper(q, t0, t1, 0.028, 0.042), sdTaper(q, t1, t2, 0.042, 0.008)) + 0.006 * fbm(q * 25.0 + so);
      vec2 fl = vec2(q.x * 60.0 + fbm(q * 5.0 + so) * 3.0, q.y * 4.0);
      float strand = 0.6 * noise(fl + so) + 0.4 * noise(fl * vec2(3.0, 2.0) + so);
      vec3 c = shade(uHair * (0.75 + 0.5 * strand), normalize(vec3(pside * 0.3, 0.3, 0.9)), L, jit) * 0.8;
      c *= mix(0.7, 1.0, smoothstep(0.0, 0.015, -d));
      col = mix(col, c, fill(d, soft));
    }
  }

  // ---- neck
  {
    float nw = 0.06 * HEAD_W * mix(1.0, 0.82, FEMALE);
    vec2 nc = vec2(0.0, hc.y - 0.19);
    float d = sdE(q - nc, vec2(nw, 0.15));
    vec3 n = normalize(vec3((q.x / nw) * 0.9, -0.2, 0.8));
    vec3 c = shade(uSkin * 0.85, n, L, jit);
    if (SCALES > 0.0) {
      float m = smoothstep(0.55, 0.8, abs(q.x) / nw + 0.3 * fbm(q * 20.0 + so)) * SCALES * 0.9;
      c = scaleSkin(c, q * vec2(55.0, 65.0) + so, m, n, L, jit);
    }
    c *= mix(0.9, 0.35, smoothstep(hc.y - 0.24, hc.y - 0.12, q.y));
    col = mix(col, c, fill(d, soft));
  }

  // ---- body / outfit
  vec2 bc = vec2(0.0, -0.53);
  vec2 br = vec2(0.46 * BW, 0.31);
  float dBody = sdE(q - bc, br);
  vec3 bn = ellN(q - bc, br);
  float folds = sin(q.x * 38.0 + fbm(q * 4.0 + so) * 7.0);
  float bodyDark = mix(0.55, 1.0, smoothstep(-0.62, -0.3, q.y));
  bool strap = false;
  bool brooch = true;

  if (eq(OUTFIT, 0.0)) {
    // mage robe with a trimmed V collar
    vec3 c = shade(uCloth, bn, L, jit + 0.2 * folds) * (0.9 + 0.1 * folds);
    float vy = -0.40 + abs(q.x) * 1.25;
    vec3 inner = shade(uTrim * 0.4 + uCloth * 0.25, bn, L, jit) * 0.8;
    c = mix(c, inner, smoothstep(vy - 0.002, vy + 0.002, q.y));
    vec3 tc = shade(uTrim, bn, L, jit) * (0.9 + 0.2 * noise(q * 150.0));
    c = mix(c, tc, fill(abs(q.y - vy) - 0.016, 0.0015));
    float emb = fill(abs(q.y - vy) - 0.0025, 0.001) * (0.5 + 0.5 * sin(q.x * 160.0));
    c = mix(c, uMagic * 1.2, emb * 0.6);
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 rq = q - vec2(sx * 0.26 * BW, -0.42);
      float rune = abs(length(rq) - 0.03) - 0.002;
      rune = min(rune, max(abs(rq.x) - 0.0015, abs(rq.y) - 0.03));
      rune = min(rune, max(abs(rq.y + rq.x * 0.6) - 0.0015, abs(rq.x) - 0.022));
      c = mix(c, uMagic * 1.1, fill(rune, 0.0012) * 0.55);
      addGlow += uMagic * 0.12 * fill(rune - 0.004, 0.004) * fill(dBody, soft);
    }
    addGlow += uMagic * 0.15 * emb * fill(dBody, soft);
    col = mix(col, c * bodyDark, fill(dBody, soft));
    brooch = false;
  } else if (eq(OUTFIT, 1.0)) {
    // plate armour: breastplate, tabard, gorget, pauldrons
    vec3 c = metal(uMetal, normalize(bn + vec3(sign(q.x) * 0.25, 0.0, 0.0)), L, jit);
    c *= 1.0 - 0.35 * smoothstep(0.85, 1.0, fract((q.y + 0.4) * 16.0)) * step(q.y, -0.33);
    float dTab = max(abs(q.x) - 0.075, q.y + 0.33);
    vec3 tabc = shade(uCloth, bn, L, jit + 0.2 * folds) * (0.9 + 0.1 * folds);
    tabc = mix(tabc, shade(uTrim, bn, L, jit), fill(abs(abs(q.x) - 0.066) - 0.006, 0.001));
    c = mix(c, tabc, fill(dTab, soft));
    col = mix(col, c * bodyDark, fill(dBody, soft));

    vec2 gq = q - vec2(0.0, -0.225);
    vec2 gr = vec2(0.105, 0.05);
    vec3 gcol = metal(uMetal, ellN(gq, gr), L, jit);
    gcol *= 1.0 - 0.3 * smoothstep(0.7, 1.0, fract(gq.y * 40.0));
    col = mix(col, gcol, fill(sdE(gq, gr), soft));

    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 pq = rot(sx * 0.35) * (q - vec2(sx * 0.3 * BW, -0.29));
      vec2 pr = vec2(0.16, 0.1);
      float dP = sdE(pq, pr);
      vec3 pn = ellN(pq, pr);
      vec3 pcol = metal(uMetal, pn, L, jit);
      pcol *= 1.0 - 0.3 * smoothstep(0.8, 1.0, fract(length(pq / pr) * 3.0));
      pcol = mix(pcol, metal(uTrim, pn, L, jit), fill(abs(dP + 0.008) - 0.006, 0.0015));
      for (int k = 0; k < 3; k++) {
        float a = 0.7 + float(k) * 0.85;
        vec2 rp = vec2(cos(a) * pr.x, sin(a) * pr.y) * 0.72;
        vec2 rq = pq - rp;
        pcol = mix(pcol, metal(uMetal * 1.2, normalize(vec3(rq / 0.007, 0.5)), L, jit), fill(length(rq) - 0.007, 0.0012));
      }
      col = mix(col, pcol, fill(dP, soft));
    }
    brooch = false;
  } else if (eq(OUTFIT, 2.0)) {
    // ranger: cloak over a laced leather vest
    vec3 c = shade(uCloth, bn, L, jit + 0.2 * folds) * (0.9 + 0.1 * folds);
    float dv = abs(q.x) - (0.12 + (-0.22 - q.y) * 0.4);
    vec3 vc = shade(uLeather, bn, L, jit) * (0.85 + 0.2 * noise(q * vec2(20.0, 80.0) + so));
    vc *= 1.0 - 0.4 * fill(abs(abs(q.x) - 0.065) - 0.0018, 0.0008) * step(0.5, fract(q.y * 70.0));
    float lx = abs(fract(q.y * 30.0) - 0.5) * 2.0;
    vc = mix(vc, uLeather * 0.35, fill(abs(abs(q.x) - lx * 0.012) - 0.0018, 0.0008) * step(abs(q.x), 0.013));
    vc *= 1.0 - 0.35 * smoothstep(-0.02, 0.0, dv);
    c = mix(c, vc, fill(dv, 0.002));
    col = mix(col, c * bodyDark, fill(dBody, soft));
    strap = eq(PROP, 3.0) || eq(PROP, 5.0);
  } else if (eq(OUTFIT, 3.0)) {
    // survivor: rough cloth, fur collar or strap
    vec3 c = shade(uCloth, bn, L, jit + 0.2 * folds);
    c *= (0.9 + 0.1 * folds) * (0.92 + 0.16 * fbm(q * 9.0 + so));
    col = mix(col, c * bodyDark, fill(dBody, soft));
    strap = FUR < 0.5;
  } else if (eq(OUTFIT, 4.0)) {
    // kimono: crossed collar (left over right) with a white under-collar
    vec3 c = shade(uCloth, bn, L, jit + 0.2 * folds) * (0.9 + 0.1 * folds);
    vec2 pq = q + vec2(folds * 0.004, 0.0);
    float pat = 0.0;
    if (eq(PATTERN, 1.0)) {
      pat = seig(pq * 14.0) * 0.55;
    } else if (eq(PATTERN, 2.0)) {
      pat = mod(floor(pq.x * 16.0) + floor(pq.y * 16.0), 2.0) * 0.45;
    } else if (eq(PATTERN, 3.0)) {
      vec2 cell = floor(pq * 11.0);
      vec2 fc = fract(pq * 11.0) - 0.5 - hash2(cell) * 0.2;
      float h = hash1(cell + 3.1);
      pat = step(0.55, h) * fill(sdFlower(rot(h * 6.28) * fc, 0.28, 5.0), 0.04) * 0.8;
    }
    c = mix(c, shade(uAcc, bn, L, jit), pat);
    float x0 = q.x + 0.015;
    float lineL = -0.35 - x0 * 1.15;
    float lineR = -0.35 + x0 * 1.15;
    float vy = max(lineL, lineR);
    vec3 collar = shade(uTrim, bn, L, jit) * (0.9 + 0.15 * noise(q * 120.0));
    c = mix(c, collar, step(x0, 0.0) * band(q.y, lineL - 0.028, lineL) * step(lineR, q.y));
    c *= 1.0 - 0.3 * band(q.y, lineR - 0.036, lineR - 0.028);
    c = mix(c, collar, band(q.y, lineR - 0.028, lineR));
    vec3 skinC = shade(uSkin * 0.8, bn, L, jit) * 0.85;
    vec3 inner = shade(vec3(0.9, 0.88, 0.84), bn, L, jit);
    c = mix(c, mix(skinC, inner, step(q.y, vy + 0.012)), smoothstep(vy - 0.0015, vy + 0.0015, q.y));
    col = mix(col, c * bodyDark, fill(dBody, soft));
    brooch = false;
  } else {
    // samurai: laced lamellar do over a kimono, rectangular sode
    vec3 c = lamellar(q, bn, L, jit);
    float vy = -0.33 + abs(q.x) * 1.3;
    c *= 1.0 - 0.4 * band(q.y, vy - 0.042, vy - 0.032);
    c = mix(c, shade(uCloth, bn, L, jit), smoothstep(vy - 0.034, vy - 0.03, q.y));
    c = mix(c, shade(vec3(0.9, 0.88, 0.84), bn, L, jit), band(q.y, vy - 0.007, vy));
    c = mix(c, shade(uSkin * 0.8, bn, L, jit) * 0.85, smoothstep(vy - 0.0015, vy + 0.0015, q.y));
    col = mix(col, c * bodyDark, fill(dBody, soft));
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 sq = rot(sx * 0.3) * (q - vec2(sx * 0.33 * BW, -0.34));
      float ds = sdBox(sq, vec2(0.095, 0.085)) - 0.008;
      vec3 sn = normalize(vec3(sx * 0.35, 0.25, 0.9));
      vec3 sc = lamellar(sq + vec2(0.0, 0.3), sn, L, jit);
      sc = mix(sc, metal(uMetal * 1.1, sn, L, jit), band(sq.y, 0.072, 0.1));
      col = mix(col, sc, fill(ds, soft));
    }
    brooch = false;
  }

  if (FUR > 0.5) {
    float ra = atan(q.x - bc.x, q.y - bc.y);
    vec2 fw = vec2(ra * 30.0 + fbm(q * 8.0 + so) * 3.0, length(q - bc) * 10.0);
    float fs = 0.6 * noise(fw + so) + 0.4 * noise(fw * vec2(2.5, 1.5) + so);
    float d = abs(dBody + 0.025) - 0.05 + 0.035 * fbm(q * 18.0 + so) + 0.015 * fs;
    d = max(d, -0.36 - q.y + 0.03 * fbm(q * 20.0 + so));
    col = mix(col, shade(uFur * (0.75 + 0.45 * fs), ellN(q - bc, br * 1.05), L, jit), fill(d, 0.004));
  }
  if (strap) {
    vec2 sd = normalize(vec2(PS, 1.25));
    float d = max(abs(dot(q - vec2(0.0, -0.45), vec2(sd.y, -sd.x))) - 0.022, dBody + 0.01);
    col = mix(col, shade(uLeather * 0.9, vec3(0.0, 0.3, 0.95), L, jit) * (0.85 + 0.2 * stroke), fill(d, soft));
    vec2 bp = vec2(-PS * 0.075, -0.37);
    float db = abs(sdE(q - bp, vec2(0.022, 0.028))) - 0.005;
    col = mix(col, metal(uMetal, vec3(-0.3, 0.4, 0.87), L, jit) * 1.15, fill(db, 0.0015));
  }
  if (brooch) {
    vec2 cq = q - vec2(0.0, -0.285);
    col = mix(col, metal(uMetal, normalize(vec3(cq / 0.02, 0.6)), L, jit) * 1.1, fill(length(cq) - 0.02, 0.0015));
  }

  // ---- amulet
  if (AMULET > 0.5) {
    vec2 pd = vec2(0.0, -0.335);
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      float d = sdTaper(q, vec2(sx * 0.045, -0.2), pd + vec2(sx * 0.004, 0.018), 0.0017, 0.0017);
      vec3 cc = metal(uMetal, vec3(sx * 0.3, 0.4, 0.86), L, jit) * (0.6 + 0.6 * step(0.5, fract(q.y * 220.0)));
      col = mix(col, cc, fill(d, 0.001));
    }
    vec2 gq = q - pd;
    float dp = sdE(gq, vec2(0.014, 0.019));
    col = mix(col, metal(uMetal, normalize(vec3(gq / 0.02, 0.5)), L, jit), fill(dp - 0.004, 0.0012));
    col = mix(col, gem(gq, L), fill(dp, 0.001));
    addGlow += uMagic * 0.3 * exp(-length(gq) / 0.025);
  }

  // ---- scarf
  if (SCARF > 0.5) {
    vec2 sq = q - vec2(0.0, -0.215);
    vec2 sr = vec2(0.12 * mix(1.0, 0.9, FEMALE), 0.05);
    float d = sdE(sq, sr) + 0.006 * fbm(q * 20.0 + so);
    d = min(d, sdTaper(q, vec2(-PS * 0.05, -0.24), vec2(-PS * 0.08, -0.42), 0.03, 0.035));
    float wr = sin((sq.x * 1.2 + sq.y * 3.0) * 60.0 + fbm(q * 8.0 + so) * 4.0);
    vec3 sc = shade(uAcc * (0.9 + 0.1 * wr), normalize(vec3(sq / sr * 0.6, 0.8)), L, jit + 0.2 * wr);
    sc *= 0.9 + 0.1 * step(0.5, fract(q.y * 40.0 - q.x * 10.0));
    col = mix(col, sc, fill(d, soft));
  }

  // ---- props in front of the body
  if (eq(PROP, 1.0)) {
    // staff with a crystal
    float x0 = PS * 0.31;
    vec2 a = vec2(x0, -0.55), b = vec2(x0 - PS * 0.015, 0.23);
    float t = (q.y - a.y) / (b.y - a.y);
    vec3 sn = normalize(vec3((q.x - mix(a.x, b.x, t)) / 0.012, 0.0, 0.8));
    vec3 wood = uLeather * 1.25 * (0.8 + 0.35 * noise(vec2(q.x * 400.0, q.y * 20.0)));
    vec3 sc = shade(wood, sn, L, jit);
    sc = mix(sc, metal(uTrim, sn, L, jit), step(0.86, t) * step(t, 0.95) * step(fract(q.y * 90.0), 0.5));
    col = mix(col, sc, fill(sdTaper(q, a, b, 0.012, 0.01), soft));
    vec2 top = b + vec2(0.0, 0.055);
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 m = b + vec2(sx * 0.03, 0.03);
      float d = min(sdTaper(q, b, m, 0.006, 0.004), sdTaper(q, m, top + vec2(sx * 0.01, 0.035), 0.004, 0.0015));
      col = mix(col, metal(uTrim, vec3(sx * 0.4, 0.3, 0.86), L, jit), fill(d, soft));
    }
    vec2 cq = q - top;
    col = mix(col, gem(cq, L), fill(sdRhomb(cq, vec2(0.022, 0.045)), 0.0015));
    addGlow += uMagic * (0.55 * exp(-length(cq) / 0.035) + 0.18 * exp(-length(cq) / 0.1));
    for (int i = 0; i < 7; i++) {
      float fi = float(i);
      vec2 sp = top + vec2(cos(fi * 2.4 + uSeed), sin(fi * 1.7 + uSeed * 1.3)) * (0.04 + 0.05 * hash1(vec2(fi, uSeed)));
      vec2 dq = q - sp;
      addGlow += uMagic * (exp(-length(dq) / 0.0025) + 0.4 * exp(-abs(dq.x) / 0.0012 - abs(dq.y) / 0.01) + 0.4 * exp(-abs(dq.y) / 0.0012 - abs(dq.x) / 0.01));
    }
  }
  if (eq(PROP, 10.0)) {
    // spear with a leaf blade and a tassel
    float x0 = PS * 0.32;
    vec2 a = vec2(x0, -0.55), b = vec2(x0 - PS * 0.012, 0.19);
    float t = (q.y - a.y) / (b.y - a.y);
    vec3 sn = normalize(vec3((q.x - mix(a.x, b.x, t)) / 0.01, 0.0, 0.8));
    col = mix(col, shade(uLeather * 1.1 * (0.85 + 0.25 * noise(vec2(q.x * 400.0, q.y * 20.0))), sn, L, jit), fill(sdTaper(q, a, b, 0.0095, 0.0085), soft));
    vec2 bq = q - (b + vec2(0.0, 0.075));
    float dBl = sdE(bq, vec2(0.02, 0.07));
    vec3 bln = normalize(vec3(sign(bq.x) * 0.5, 0.2, 0.85));
    col = mix(col, metal(uMetal, bln, L, jit) + 0.15 * fill(abs(bq.x) - 0.0015, 0.001), fill(dBl, soft));
    col = mix(col, metal(uMetal * 0.9, sn, L, jit), fill(sdTaper(q, b - vec2(0.0, 0.012), b + vec2(0.0, 0.012), 0.012, 0.009), soft));
    vec2 tq = q - b;
    float dT = sdTaper(q, b - vec2(0.0, 0.012), b + vec2(PS * 0.018, -0.08), 0.01, 0.024) + 0.006 * noise(vec2(tq.x * 300.0, 0.0));
    vec3 tcol = shade(uAcc * (0.75 + 0.4 * noise(vec2(tq.x * 400.0, tq.y * 20.0))), vec3(PS * 0.3, 0.2, 0.9), L, jit);
    col = mix(col, tcol, fill(dT, 0.0015));
  }
  if (eq(PROP, 7.0)) {
    // floating grimoire with glowing pages
    vec2 gc = vec2(PS * 0.265, -0.03 + 0.01 * sin(uSeed));
    vec2 gq = q - gc;
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 pq = rot(sx * 0.12) * (gq - vec2(sx * 0.036, 0.0));
      float dc = sdBox(pq, vec2(0.037, 0.05)) - 0.003;
      col = mix(col, shade(mix(uCloth, uLeather, 0.5) * 0.8, vec3(sx * 0.3, 0.2, 0.9), L, jit), fill(dc, soft));
      float dpg = sdBox(pq - vec2(sx * -0.002, 0.004), vec2(0.031, 0.043));
      vec3 page = mix(vec3(0.92, 0.87, 0.75), uMagic, 0.2) * (0.9 + 0.1 * noise(pq * 200.0));
      page *= mix(0.8, 1.05, smoothstep(0.03, -0.02, sx * pq.x));
      float ln = step(abs(fract(pq.y * 90.0) - 0.5), 0.14) * step(abs(pq.x), 0.023) * step(abs(pq.y), 0.036);
      page = mix(page, uMagic * 0.6, ln * 0.7);
      col = mix(col, page, fill(dpg, 0.0012));
    }
    addGlow += uMagic * 0.3 * exp(-length(gq) / 0.05);
    for (int i = 0; i < 5; i++) {
      float fi = float(i);
      float h = hash1(vec2(fi, uSeed + 2.0));
      vec2 gp = gc + vec2((h - 0.5) * 0.09, 0.06 + fract(h * 7.3) * 0.1);
      float dr = abs(length(q - gp) - 0.006) - 0.0012;
      addGlow += uMagic * 0.9 * fill(dr, 0.0012);
      addGlow += uMagic * 0.12 * exp(-length(q - gp) / 0.01);
    }
  }
  if (eq(PROP, 8.0)) {
    // arcane orb with an orbiting ring
    vec2 oq = q - vec2(PS * 0.26, 0.02);
    float r0 = 0.042;
    vec2 rq = rot(0.4 * PS) * oq;
    float dr = abs(sdE(rq, vec2(0.075, 0.018))) - 0.002;
    col = mix(col, uMagic * 1.1, fill(dr, 0.001) * step(0.0, rq.y));
    float z = sqrt(max(0.0, 1.0 - dot(oq, oq) / (r0 * r0)));
    vec3 on = normalize(vec3(oq / r0, z));
    float sw = fbm(oq * 40.0 + vec2(uSeed * 3.0, 0.0) + fbm(oq * 20.0 + so) * 2.0);
    vec3 oc = uMagic * (0.35 + 0.9 * smoothstep(-0.2, 0.5, sw)) * (0.6 + 0.4 * on.z);
    oc += pow(max(dot(reflect(-L, on), vec3(0.0, 0.0, 1.0)), 0.0), 30.0) * 0.8;
    oc += uMagic * 0.4 * pow(1.0 - on.z, 3.0);
    col = mix(col, oc, fill(length(oq) - r0, 0.0015));
    col = mix(col, uMagic * 1.3, fill(dr, 0.001) * step(rq.y, 0.0));
    addGlow += uMagic * (0.45 * exp(-length(oq) / 0.05) + 0.15 * exp(-length(oq) / 0.12));
  }

  // ---- twin tails
  if (hasHair && !hood && eq(EXTRA, 3.0)) {
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 t0 = hc + vec2(sx * hr.x * 0.92, hr.y * 0.55);
      vec2 t1 = t0 + vec2(sx * 0.085, -0.12);
      vec2 t2 = t0 + vec2(sx * 0.07, -0.34 - 0.14 * HAIR_LEN);
      float d = min(sdTaper(q, t0, t1, 0.03, 0.058), sdTaper(q, t1, t2, 0.058, 0.01)) + 0.008 * fbm(q * vec2(25.0, 8.0) + so);
      vec2 fl = vec2(q.x * 55.0 + fbm(q * 5.0 + so) * 4.0, q.y * 4.0);
      float strand = 0.6 * noise(fl + so) + 0.4 * noise(fl * vec2(3.0, 2.0) + so);
      vec3 c = shade(uHair * (0.72 + 0.5 * strand), normalize(vec3(sx * 0.35, 0.15, 0.9)), L, jit) * 0.92;
      c *= mix(0.65, 1.0, smoothstep(0.0, 0.02, -d));
      col = mix(col, c, fill(d, soft));
    }
  }

  // ---- ears
  if (!topCovered) {
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 ep = hc + vec2(sx * hr.x * 0.93, 0.0);
      float d, di;
      vec2 lobe = ep + vec2(sx * 0.012, -0.04);
      if (eq(EAR, 1.0)) {
        d = sdTaper(q, ep, ep + vec2(sx * 0.1, 0.085), 0.022, 0.002);
        di = sdTaper(q, ep + vec2(sx * 0.01, 0.0), ep + vec2(sx * 0.08, 0.066), 0.011, 0.001);
        lobe = ep + vec2(sx * 0.008, -0.025);
      } else if (eq(EAR, 2.0)) {
        d = sdTaper(q, ep, ep + vec2(sx * 0.17, 0.03), 0.034, 0.003);
        di = sdTaper(q, ep + vec2(sx * 0.015, 0.0), ep + vec2(sx * 0.14, 0.026), 0.017, 0.001);
        lobe = ep + vec2(sx * 0.025, -0.03);
      } else if (eq(EAR, 3.0)) {
        d = sdTaper(q, ep, ep + vec2(sx * 0.07, 0.035), 0.034, 0.01);
        di = 1.0;
        for (int k = 0; k < 3; k++) {
          float fk = float(k);
          di = min(di, sdTaper(q, ep + vec2(0.0, 0.025 - fk * 0.025), ep + vec2(sx * (0.1 - fk * 0.018), 0.07 - fk * 0.045), 0.006, 0.001));
        }
        d = min(d, di);
      } else {
        d = sdE(q - ep - vec2(sx * 0.01, -0.005), vec2(0.022, 0.036));
        di = sdE(q - ep - vec2(sx * 0.012, -0.005), vec2(0.011, 0.022));
      }
      vec3 c = shade(uSkin, normalize(vec3(sx * 0.6, 0.2, 0.8)), L, jit);
      if (eq(EAR, 3.0)) {
        c = mix(shade(uScale * 0.75, normalize(vec3(sx * 0.6, 0.2, 0.8)), L, jit),
                shade(uScale * 1.1, normalize(vec3(sx * 0.5, 0.5, 0.7)), L, jit), fill(di, 0.002));
      } else {
        c = mix(c, c * vec3(0.6, 0.45, 0.45), fill(di, 0.004) * 0.7);
      }
      col = mix(col, c, fill(d, soft));
      if (EARRINGS > 0.5 && !eq(EAR, 3.0)) {
        vec2 lq = q - lobe - vec2(0.0, -0.009);
        col = mix(col, metal(uMetal, normalize(vec3(lq / 0.009, 0.5)), L, jit) * 1.2, fill(abs(length(lq) - 0.009) - 0.0018, 0.0008));
        col = mix(col, gem(lq + vec2(0.0, 0.01), L), fill(length(lq + vec2(0.0, 0.01)) - 0.0045, 0.0008));
      }
    }
  }

  // ---- head
  {
    vec3 n = ellN(hq, hr);
    float nsz = NOSE;
    float noseMask = exp(-pow(fq.x / (0.017 * nsz), 2.0)) * smoothstep(0.03, -0.01, fq.y) * smoothstep(-0.085, -0.05, fq.y);
    n = normalize(n + vec3(fq.x / (0.017 * nsz), 0.0, 0.0) * noseMask * 0.7);
    vec2 tp = fq - vec2(0.0, -0.058);
    float tr = 0.012 * nsz;
    n = normalize(n + vec3(tp / tr, 0.0) * exp(-dot(tp, tp) / (tr * tr)) * 0.35);
    float cheek = 0.0;
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 cd = fq - vec2(sx * 0.07, -0.03);
      cheek += exp(-dot(cd, cd) / 0.0016);
    }
    n = normalize(n + vec3(0.0, 0.25, 0.0) * cheek);
    vec3 c = shade(uSkin, n, L, jit);
    float sv = fbm(fq * 22.0 + so);
    c *= mix(vec3(0.94, 0.97, 1.0), vec3(1.06, 0.97, 0.94), 0.5 + sv);

    float blush = eq(RACE, 3.0) ? 0.5 : 0.3 + 0.08 * FEMALE;
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 cd = fq - vec2(sx * 0.066, -0.055);
      c = mix(c, c * vec3(1.12, 0.82, 0.8), blush * exp(-dot(cd, cd) / 0.0014));
      vec2 sdv = (fq - vec2(sx * es, 0.004)) * vec2(0.75, 1.4);
      c *= 1.0 - 0.4 * exp(-dot(sdv, sdv) / 0.0011);
    }

    // dragon scales on the temples and outer cheekbones
    if (SCALES > 0.0) {
      float side = smoothstep(hr.x * 0.62, hr.x * 0.92, abs(fq.x)) * smoothstep(-0.07, -0.02, fq.y) * smoothstep(0.08, 0.03, fq.y);
      float under = exp(-pow((abs(fq.x) - es - 0.02) / 0.016, 2.0)) * exp(-pow((fq.y + 0.026) / 0.009, 2.0));
      float m = smoothstep(0.4, 0.7, clamp(side + under * 0.9, 0.0, 1.0) + 0.3 * fbm(fq * 20.0 + so)) * SCALES * 0.9;
      c = scaleSkin(c, fq * vec2(55.0, 65.0) + so, m, n, L, jit);
    }

    if (FRECKLES > 0.5) {
      vec2 fc = fq * 170.0;
      vec2 cid = floor(fc);
      float dd = length(fract(fc) - 0.5 - hash2(cid) * 0.25);
      float fm = exp(-pow((abs(fq.x) - 0.045) / 0.035, 2.0)) * exp(-pow((fq.y + 0.035) / 0.03, 2.0))
               + 0.6 * exp(-pow(fq.x / 0.015, 2.0)) * exp(-pow((fq.y + 0.03) / 0.02, 2.0));
      c = mix(c, c * vec3(0.72, 0.55, 0.45), step(0.8, hash1(cid + so)) * smoothstep(0.35, 0.15, dd) * fm * 0.8);
    }

    // face marks: war paint, mystic mark, elven tattoo
    float pm = 0.0;
    if (eq(MARK, 1.0)) {
      pm = fill(abs(fq.y - 0.003) - 0.021 + 0.008 * fbm(fq * 50.0 + so), 0.002);
    } else if (eq(MARK, 2.0)) {
      for (int i = 0; i < 3; i++) {
        float fi = float(i);
        float d = sdTaper(fq, vec2(0.035 + fi * 0.017, -0.015), vec2(0.06 + fi * 0.017, -0.095), 0.005, 0.0015);
        pm = max(pm, fill(d + 0.002 * noise(fq * 200.0), 0.0015));
      }
    } else if (eq(MARK, 3.0)) {
      pm = fill(sdTaper(fq, vec2(-es, 0.075), vec2(-es + 0.01, -0.12), 0.007, 0.004) + 0.004 * fbm(fq * 60.0 + so), 0.0015);
    }
    c = mix(c, uPaint * (0.75 + 0.35 * stroke) * mix(0.6, 1.1, dot(n, L) * 0.5 + 0.5), pm * 0.85);
    if (eq(MARK, 4.0)) {
      vec2 mq = fq - vec2(0.0, 0.058);
      float dm = min(sdRhomb(mq, vec2(0.0065, 0.013)), length(mq + vec2(0.0, 0.02)) - 0.0028);
      c = mix(c, uMagic * 1.2 + 0.1, fill(dm, 0.001));
      addGlow += uMagic * 0.2 * exp(-length(mq) / 0.012);
    } else if (eq(MARK, 5.0)) {
      for (int i = 0; i < 2; i++) {
        float sx = i == 0 ? -1.0 : 1.0;
        float d = sdTaper(fq, vec2(sx * (es + 0.027), -0.004), vec2(sx * (es + 0.038), -0.032), 0.0016, 0.0006);
        d = min(d, length(fq - vec2(sx * (es + 0.02), -0.03)) - 0.0022);
        d = min(d, length(fq - vec2(sx * (es + 0.016), -0.042)) - 0.0018);
        d = min(d, length(fq - vec2(sx * (es + 0.011), -0.052)) - 0.0014);
        c = mix(c, mix(uMagic, uSkin * 0.3, 0.35), fill(d, 0.0008) * 0.85);
      }
    }

    // age
    float wr = smoothstep(0.55, 1.0, AGE);
    if (wr > 0.0) {
      float fl = fract(fq.y * 55.0 + sin(fq.x * 25.0) * 0.4);
      float fmk = smoothstep(0.04, 0.06, fq.y) * smoothstep(0.12, 0.09, fq.y) * smoothstep(0.08, 0.03, abs(fq.x));
      c *= 1.0 - 0.22 * wr * fmk * smoothstep(0.15, 0.0, abs(fl - 0.5));
      for (int i = 0; i < 2; i++) {
        float sx = i == 0 ? -1.0 : 1.0;
        vec2 ec = vec2(sx * (es + 0.03 * esz), 0.002);
        for (int k = 0; k < 3; k++) {
          float a = (float(k) - 1.0) * 0.45;
          c *= 1.0 - 0.3 * wr * fill(sdTaper(fq, ec, ec + vec2(sx * cos(a), sin(a)) * 0.02, 0.0012, 0.0004), 0.001);
        }
        c *= 1.0 - 0.3 * wr * fill(sdTaper(fq, vec2(sx * 0.022, -0.055), vec2(sx * 0.042, -0.108), 0.0018, 0.0008), 0.0015);
        vec2 bq = fq - vec2(sx * es, -0.013);
        c *= 1.0 - 0.25 * wr * fill(abs(sdE(bq, vec2(0.022, 0.009))) - 0.0009, 0.001) * step(bq.y, 0.0);
        vec2 sk = fq - vec2(sx * 0.075, -0.075);
        c *= 1.0 - 0.15 * wr * exp(-dot(sk, sk) / 0.0008);
      }
    }

    // nose
    vec2 nt = fq - vec2(0.0, -0.062);
    c *= 1.0 - 0.35 * fill(sdE(nt - vec2(0.0, -0.013 * nsz), vec2(0.021 * nsz, 0.0055 * nsz)), 0.004);
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      c *= 1.0 - 0.45 * fill(sdE(nt - vec2(sx * 0.0095 * nsz, -0.008 * nsz), vec2(0.0045, 0.0025) * nsz), 0.0015);
    }
    vec2 hl = nt - L.xy * 0.006 * nsz;
    c += uLight * 0.1 * exp(-dot(hl, hl) / (0.00006 * nsz * nsz));

    // mouth
    float mw = MOUTH_W;
    vec2 m = fq - vec2(0.0, -0.108);
    m.y += m.x * m.x * MOUTH_CURVE;
    float lipH = 0.0065 * (1.0 + 0.4 * FEMALE);
    c = mix(c, uLip * mix(0.8, 1.1, dot(n, L) * 0.5 + 0.5), fill(sdE(m - vec2(0.0, -lipH * 1.2), vec2(mw * 0.75, lipH)), 0.002) * (0.45 + 0.2 * FEMALE));
    c = mix(c, uLip * 0.7, fill(sdE(m - vec2(0.0, 0.004), vec2(mw * 0.8, 0.004 * (1.0 + 0.3 * FEMALE))), 0.002) * (0.35 + 0.2 * FEMALE));
    c = mix(c, uSkin * vec3(0.25, 0.16, 0.16), fill(abs(m.y) - 0.0017, 0.0012) * smoothstep(mw, mw * 0.5, abs(m.x)));
    if (FANG > 0.5) {
      float fx = -pside * mw * 0.45;
      vec2 fb = vec2(fx, -0.108 - fx * fx * MOUTH_CURVE);
      c = mix(c, vec3(0.95, 0.93, 0.88), fill(sdTaper(fq, fb, fb + vec2(0.0015, -0.009), 0.0028, 0.0004), 0.0007));
    }
    vec2 ch = fq - vec2(0.0, -0.14);
    c *= 1.0 - 0.12 * exp(-dot(ch, ch) / 0.0005);

    // eyes and brows
    float eyeTilt = 0.12, eyeW = 0.025, eyeH = 0.0105, irisK = 1.0, lidDrop = 0.0;
    if (eq(EYE_SHAPE, 1.0)) { eyeTilt = 0.32; eyeH = 0.0092; }
    else if (eq(EYE_SHAPE, 2.0)) { eyeTilt = -0.18; eyeH = 0.0118; }
    else if (eq(EYE_SHAPE, 3.0)) { eyeW = 0.027; eyeH = 0.0145; irisK = 1.3; }
    else if (eq(EYE_SHAPE, 4.0)) { lidDrop = 0.42; }
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec3 eyeCol = i == 0 ? uEye2 : uEye;
      vec2 e = vec2(sx * es, 0.0);
      vec2 d = fq - e;
      vec2 ed = d;
      ed.y -= sx * ed.x * eyeTilt;
      float dEye = sdE(ed, vec2(eyeW, eyeH) * esz);
      vec3 sclera = mix(uSkin * 0.5, vec3(0.86, 0.82, 0.76), 0.7) * 0.85;
      float ir = 0.0105 * esz * irisK;
      float di = length(d) - ir;
      vec3 iris = eyeCol * (0.45 + 0.9 * smoothstep(ir, 0.0, length(d - vec2(0.0, -0.004 * irisK))));
      if (irisK > 1.1) iris *= mix(1.0, 0.55, smoothstep(-ir * 0.2, ir, d.y));
      iris *= mix(0.45, 1.0, smoothstep(0.0, -0.003, di));
      vec3 ec = mix(sclera, iris, fill(di, 0.001));
      if (eq(PUPIL, 2.0)) {
        ec = mix(ec, mix(uMagic, vec3(1.0), 0.5), fill(sdStar5(d, 0.0068 * esz * irisK), 0.0007));
      } else {
        float pupil = eq(PUPIL, 1.0) ? sdE(d, vec2(0.0022, 0.0085) * esz * irisK) : length(d) - 0.0042 * esz * irisK;
        ec = mix(ec, vec3(0.02), fill(pupil, 0.0008));
      }
      ec *= mix(1.0, 0.5, smoothstep(-0.004, 0.008, ed.y));
      ec = mix(ec, vec3(1.0), fill(length(d - vec2(-0.004, 0.004) * irisK) - 0.0022 * irisK, 0.0008) * 0.85);
      if (irisK > 1.1) ec = mix(ec, vec3(1.0), fill(length(d - vec2(0.004, -0.005)) - 0.0012, 0.0006) * 0.7);
      float lidY = eyeH * esz * (1.0 - 2.0 * lidDrop);
      float open = lidDrop > 0.0 ? smoothstep(lidY + 0.001, lidY - 0.001, ed.y) : 1.0;
      c = mix(c, ec, fill(dEye, 0.0015) * open);
      float lid = fill(abs(dEye) - mix(0.0013, 0.0021, FEMALE), 0.001) * smoothstep(-0.004, 0.0, ed.y) * (lidDrop > 0.0 ? step(lidY, ed.y) : 1.0);
      c = mix(c, uSkin * 0.12, lid * 0.9);
      if (lidDrop > 0.0) c = mix(c, uSkin * 0.12, fill(abs(ed.y - lidY) - 0.0016, 0.0009) * fill(dEye, 0.001) * 0.9);
      if (FEMALE > 0.5 || irisK > 1.1) {
        vec2 oc = vec2(sx * (es + 0.023 * esz * eyeW / 0.025), 0.003 + (eyeTilt - 0.12) * 0.008);
        c = mix(c, uSkin * 0.08, fill(sdTaper(fq, oc - vec2(sx * 0.004, 0.0), oc + vec2(sx * 0.009, 0.007), 0.0019, 0.0003), 0.0008));
      }

      float tilt = BROW_TILT;
      float th = mix(0.0058, 0.0036, FEMALE);
      vec2 bIn = e + vec2(-sx * 0.026, 0.021 - tilt);
      vec2 bMid = e + vec2(sx * 0.004, 0.029 + FEMALE * 0.005 - tilt * 0.3);
      vec2 bOut = e + vec2(sx * 0.031, 0.024 + tilt * 0.3);
      float dB = min(sdTaper(fq, bIn, bMid, th, th * 0.85), sdTaper(fq, bMid, bOut, th * 0.85, th * 0.4));
      dB += 0.002 * noise(fq * 300.0);
      c = mix(c, uHair * 0.7 * (0.8 + 0.3 * noise(fq * vec2(400.0, 60.0))), fill(dB, 0.0015) * 0.9);
    }

    if (MOLE > 0.5) c = mix(c, uSkin * 0.3, fill(length(fq - vec2(pside * (es + 0.014), -0.025)) - 0.0022, 0.0008));

    if (SCAR > 0.5) {
      float dS = sdTaper(fq, vec2(-es - 0.02, 0.05), vec2(-es + 0.025, -0.07), 0.0035, 0.0015);
      c *= 1.0 - 0.3 * fill(abs(dS) - 0.001, 0.001);
      c = mix(c, c * vec3(1.25, 0.92, 0.92) + 0.04, fill(dS, 0.0012));
    }

    if (EYEPATCH > 0.5) {
      vec2 pq = fq - vec2(pside * es, 0.003);
      float dst = min(sdTaper(fq, vec2(pside * es, 0.015), vec2(-pside * hr.x * 1.1, 0.11), 0.003, 0.003),
                      sdTaper(fq, vec2(pside * es, -0.008), vec2(pside * hr.x * 1.1, -0.03), 0.003, 0.003));
      c = mix(c, vec3(0.05, 0.045, 0.045), fill(max(dst, dHead), 0.001));
      vec3 pc = shade(vec3(0.1, 0.085, 0.08), normalize(vec3(pq / vec2(0.03, 0.024) * 0.6, 0.8)), L, jit);
      pc *= 1.0 - 0.3 * fill(abs(sdE(pq, vec2(0.026, 0.02))) - 0.0008, 0.0006);
      c = mix(c, pc, fill(sdE(pq, vec2(0.03, 0.024)), 0.0012));
    }

    if (GLASSES > 0.5) {
      float rg = 0.029 * esz;
      for (int i = 0; i < 2; i++) {
        float sx = i == 0 ? -1.0 : 1.0;
        if (eq(GLASSES, 2.0) && sx < 0.0) continue;
        vec2 gq = fq - vec2(sx * es, 0.0);
        float inL = fill(length(gq) - rg, 0.001);
        c = mix(c, c * 0.9 + uBg * 0.1 + 0.03, inL * 0.5);
        c += 0.22 * fill(abs(dot(gq, normalize(vec2(1.0, 1.0)))) - 0.003, 0.002) * fill(length(gq) - rg * 0.8, 0.002);
        float thick = eq(GLASSES, 2.0) ? 0.0024 : 0.0016;
        c = mix(c, metal(uMetal, normalize(vec3(gq / rg, 0.4)), L, jit) + 0.05, fill(abs(length(gq) - rg) - thick, 0.0008));
        float dt = max(sdTaper(fq, vec2(sx * (es + rg), 0.004), vec2(sx * hr.x * 1.05, 0.012), 0.0013, 0.0013), dHead);
        if (eq(GLASSES, 1.0)) c = mix(c, metal(uMetal, vec3(0.0, 0.3, 0.95), L, jit), fill(dt, 0.0008));
      }
      if (eq(GLASSES, 1.0)) {
        float db = sdTaper(fq, vec2(-es + rg, 0.006), vec2(es - rg, 0.006), 0.0014, 0.0014);
        c = mix(c, metal(uMetal, vec3(0.0, 0.3, 0.95), L, jit), fill(db, 0.0008));
      }
    }

    c += uLight * 0.3 * smoothstep(-0.02, 0.0, dHead) * max(0.0, dot(normalize(hq / hr), L.xy));
    col = mix(col, c, fill(dHead, soft));
  }

  // ---- beard
  if (BEARD > 0.05) {
    float bl = BEARD;
    float dBd = sdE(fq - vec2(0.0, -0.12 - 0.03 * bl), vec2(hr.x * 0.95, 0.075 + 0.07 * bl));
    dBd = max(dBd, fq.y + 0.072);
    dBd = min(dBd, max(max(dHead - 0.004, hr.x * 0.74 - abs(fq.x)), fq.y - 0.02));
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      dBd = min(dBd, sdTaper(fq, vec2(sx * 0.004, -0.086), vec2(sx * 0.042, -0.108), 0.009, 0.003));
    }
    dBd = max(dBd, -sdE(fq - vec2(0.0, -0.113), vec2(MOUTH_W * 0.85, 0.0085)));
    dBd += 0.008 * fbm(fq * vec2(50.0, 12.0) + so);
    float strand = noise(vec2(fq.x * 160.0, fq.y * 14.0) + so);
    vec3 c = shade(uHair * (0.75 + 0.4 * strand), ellN(fq - vec2(0.0, -0.1), vec2(hr.x, 0.15)), L, jit);
    col = mix(col, c, fill(dBd, 0.003));
  }

  // ---- ninja mask over the lower face
  if (MASK > 0.5) {
    float top = -0.032 - 0.6 * fq.x * fq.x;
    float dm = max(dHead - 0.006, fq.y - top);
    float nwm = 0.06 * HEAD_W * mix(1.0, 0.82, FEMALE) + 0.006;
    dm = min(dm, max(sdE(q - vec2(0.0, hc.y - 0.2), vec2(nwm, 0.14)), q.y - (hc.y - 0.1)));
    float mf = sin(fq.x * 90.0 + fq.y * 30.0 + fbm(q * 6.0 + so) * 3.0);
    vec3 mn = normalize(ellN(hq, hr) + vec3(0.0, -0.2, 0.0));
    vec3 mc = shade(mix(uCloth, vec3(0.05), 0.6), mn, L, jit + 0.2 * mf) * (0.9 + 0.1 * mf);
    mc += uLight * 0.08 * exp(-pow(fq.x / 0.018, 2.0)) * smoothstep(-0.03, -0.06, fq.y) * smoothstep(-0.09, -0.06, fq.y);
    col = mix(col, mc, fill(dm, 0.002));
  }

  // ---- hair on top
  if (hasHair && !topCovered) {
    vec2 cc = hc + vec2(0.0, 0.02);
    vec2 cr = hr * vec2(1.1, 1.04) * HAIR_VOL;
    vec2 hq2 = q - cc;
    float dCap = sdE(hq2, cr);
    if (eq(FRINGE, 2.0)) {
      float a2 = atan(fq.x, fq.y - 0.02);
      dCap -= 0.045 * (1.0 - tri(a2 * 1.9 + PART * 0.3)) * smoothstep(-0.03, 0.06, fq.y);
    }
    float fringe;
    if (eq(FRINGE, 1.0)) {
      fringe = hc.y + 0.036 + 0.25 * fq.x * fq.x + 0.003 * noise(vec2(q.x * 60.0, 0.0) + so);
    } else if (eq(FRINGE, 2.0)) {
      fringe = hc.y + hr.y * 0.55 - 0.055 * (1.0 - tri(q.x * 16.0 + PART)) + 0.006 * noise(q * 30.0 + so);
    } else if (eq(FRINGE, 3.0)) {
      fringe = hc.y + hr.y * 0.8 + 0.015 * fbm(q * vec2(30.0, 4.0) + so);
    } else {
      fringe = hc.y + hr.y * 0.56 + PART * 0.18 * fq.x + 0.03 * fbm(q * vec2(30.0, 4.0) + so) + 0.012 * sin(q.x * 70.0 + uSeed);
    }
    float sides;
    if (eq(FRINGE, 1.0)) {
      sides = max(abs(fq.x) - hr.x * 1.12, hr.x * SIDE_IN - abs(fq.x));
      sides = max(sides, max(SIDE_LEN - fq.y + 0.003 * noise(vec2(q.x * 80.0, 0.0) + so), fq.y - 0.06));
    } else {
      sides = max(max(dCap, hr.x * SIDE_IN - abs(fq.x)), SIDE_LEN - fq.y);
    }
    float dTop = max(dCap, fringe - q.y);
    float dHair = min(dTop, sides) + 0.004 * noise(q * 90.0);

    col *= 1.0 - 0.35 * fill(dTop - 0.014, 0.01) * fill(dHead, soft);

    float a = atan(fq.x, fq.y - 0.05);
    vec2 fl = eq(FRINGE, 1.0) ? vec2(q.x * 70.0 + fbm(q * 6.0 + so) * 2.0, q.y * 3.0)
                              : vec2(a * 12.0 + fbm(q * 6.0 + so) * 2.5, length(fq) * 5.0);
    float strand = 0.55 * noise(fl + so) + 0.3 * noise(fl * vec2(4.0, 2.0) + so) + 0.15 * noise(fl * 9.0);
    vec3 n = ellN(hq2, cr);
    n = normalize(n + vec3(0.35 * strand, 0.2 * strand, 0.0));
    vec3 c = shade(uHair * (0.7 + 0.55 * strand), n, L, jit + 0.3 * strand);
    c += uLight * 0.2 * pow(max(0.0, dot(n, L)), 6.0) * (0.5 + strand);
    float ring = exp(-pow((length(q - hc - vec2(0.0, hr.y * 0.3)) - hr.y * 0.72) / 0.012, 2.0));
    c += mix(vec3(1.0), uLight, 0.4) * 0.22 * ring * (0.4 + strand) * smoothstep(0.08, 0.1, fq.y);
    col = mix(col, c, fill(dHair, 0.0025));

    // buns (top bun / odango) and samurai topknot
    vec2 bun1 = vec2(0.0, 10.0), bun2 = vec2(0.0, 10.0);
    float bunR = 0.052 * HAIR_VOL;
    if (eq(EXTRA, 1.0)) bun1 = hc + vec2(0.0, hr.y * 1.02);
    if (eq(EXTRA, 2.0)) { bun1 = hc + vec2(-hr.x * 0.8, hr.y * 0.9); bun2 = hc + vec2(hr.x * 0.8, hr.y * 0.9); }
    for (int i = 0; i < 2; i++) {
      vec2 bp = i == 0 ? bun1 : bun2;
      vec2 bq = q - bp;
      float d = length(bq) - bunR + 0.004 * noise(bq * 120.0);
      float sw = noise(vec2(atan(bq.y, bq.x) * 5.0 + length(bq) * 60.0, 0.0) + so);
      col = mix(col, shade(uHair * (0.75 + 0.45 * sw), ellN(bq, vec2(bunR)), L, jit), fill(d, soft));
      if (i == 0 && bp.y < 5.0 && eq(ORNAMENT, 2.0)) {
        vec2 k0 = bp + vec2(-0.06, 0.035), k1 = bp + vec2(0.055, -0.02);
        col = mix(col, metal(uTrim, vec3(0.0, 0.6, 0.8), L, jit), fill(sdTaper(q, k0, k1, 0.003, 0.0025), 0.001));
        vec2 fq2 = q - k0;
        col = mix(col, shade(uAcc * 1.2 + 0.1, normalize(vec3(fq2 / 0.014, 0.8)), L, jit), fill(sdFlower(fq2, 0.014, 5.0), 0.001));
        col = mix(col, vec3(0.95, 0.8, 0.3), fill(length(fq2) - 0.0035, 0.001));
      }
    }
    if (eq(EXTRA, 6.0)) {
      vec2 k0 = hc + vec2(0.0, hr.y * 0.95), k1 = k0 + vec2(0.0, 0.07);
      float dk = min(sdTaper(q, k0, k1, 0.021, 0.019), length((q - k1) * vec2(1.0, 1.4)) - 0.024);
      float ks = noise(vec2(q.x * 150.0, q.y * 10.0) + so);
      vec3 kc = shade(uHair * (0.75 + 0.45 * ks), normalize(vec3((q.x - k0.x) / 0.019 * 0.8, 0.2, 0.7)), L, jit);
      kc *= mix(0.65, 1.0, smoothstep(0.0, 0.008, -dk));
      kc = mix(kc, shade(vec3(0.9, 0.88, 0.84), vec3(0.0, 0.3, 0.95), L, jit), band(q.y, k0.y + 0.022, k0.y + 0.032) * fill(dk, 0.001));
      col = mix(col, kc, fill(dk, soft));
    }

    if (AHOGE > 0.5 && (eq(HAT, 0.0) || eq(HAT, 4.0) || eq(HAT, 7.0) || eq(HAT, 11.0))) {
      vec2 a0 = hc + vec2(0.01, 0.02 + hr.y * 1.0 * HAIR_VOL);
      vec2 a1 = a0 + vec2(0.035, 0.05), a2 = a0 + vec2(0.005, 0.085);
      float d = min(sdTaper(q, a0, a1, 0.006, 0.0045), sdTaper(q, a1, a2, 0.0045, 0.0008));
      col = mix(col, shade(uHair * 1.05, vec3(0.3, 0.4, 0.86), L, jit), fill(d, 0.001));
    }
  }

  // ---- side braid over the shoulder
  if (hasHair && !hood && eq(EXTRA, 5.0)) {
    float bs = -PS;
    vec2 b0 = hc + vec2(bs * hr.x * 0.9, -0.03);
    vec2 b1 = vec2(bs * 0.17, -0.36 - 0.05 * HAIR_LEN);
    for (int k = 0; k < 14; k++) {
      float t = (float(k) + 0.5) / 14.0;
      vec2 cpos = mix(b0, b1, t) + vec2(bs * 0.03 * sin(t * 3.0), 0.0);
      float alt = mod(float(k), 2.0) * 2.0 - 1.0;
      float rr = mix(0.03, 0.019, t);
      vec2 dq = rot(alt * 0.75) * (q - cpos - vec2(alt * rr * 0.3, 0.0));
      vec2 er = vec2(rr, rr * 0.5);
      float de = sdE(dq, er);
      float strand = noise(vec2(dq.x * 220.0, dq.y * 25.0) + so);
      vec3 bc = shade(uHair * (0.75 + 0.45 * strand), normalize(vec3(dq / er * 0.4, 0.9)), L, jit);
      bc *= mix(0.6, 1.0, smoothstep(0.0, 0.006, -de));
      col = mix(col, bc, fill(de, 0.0015));
    }
    float dt = sdTaper(q, b1, b1 + vec2(0.0, -0.045), 0.013, 0.004) + 0.003 * noise(vec2(q.x * 300.0, 0.0));
    col = mix(col, shade(uHair * 0.9, vec3(0.0, 0.2, 0.95), L, jit), fill(dt, 0.0015));
    col = mix(col, shade(uAcc, vec3(0.0, 0.3, 0.95), L, jit), fill(length((q - b1) * vec2(1.0, 2.2)) - 0.012, 0.001));
  }

  // ---- hair ornaments
  if (hasHair && !topCovered && ORNAMENT > 0.5) {
    vec2 op = hc + vec2(pside * hr.x * 0.72, hr.y * 0.72);
    if (eq(ORNAMENT, 1.0)) {
      vec2 p1 = op, p2 = vec2(0.0, 10.0);
      if (eq(EXTRA, 3.0)) { p1 = hc + vec2(-hr.x * 0.92, hr.y * 0.55); p2 = hc + vec2(hr.x * 0.92, hr.y * 0.55); }
      if (eq(EXTRA, 4.0)) p1 = hc + vec2(pside * 0.07, hr.y * 0.95 + 0.04);
      if (eq(EXTRA, 5.0)) p1 = vec2(-PS * 0.17, -0.36 - 0.05 * HAIR_LEN);
      for (int i = 0; i < 2; i++) {
        vec2 bp = i == 0 ? p1 : p2;
        vec2 bq = q - bp;
        vec3 rc = shade(uAcc, normalize(vec3(bq / 0.03 * 0.5, 0.85)), L, jit);
        col = mix(col, rc, fill(sdBow(bq, 1.1), 0.0012));
        col = mix(col, shade(uAcc * 0.8, vec3(0.0, 0.3, 0.95), L, jit), fill(length(bq) - 0.0065, 0.001));
      }
    } else if (eq(ORNAMENT, 2.0) && !(eq(EXTRA, 1.0) || eq(EXTRA, 2.0))) {
      // kanzashi with dangling chains
      vec2 k0 = op + vec2(pside * 0.02, 0.01), k1 = op + vec2(-pside * 0.05, -0.02);
      col = mix(col, metal(uTrim, vec3(0.0, 0.6, 0.8), L, jit), fill(sdTaper(q, k0, k1, 0.0028, 0.0022), 0.001));
      for (int k = 0; k < 3; k++) {
        float fk = float(k) - 1.0;
        vec2 c0 = k0 + vec2(fk * 0.008, -0.006);
        vec2 c1 = c0 + vec2(fk * 0.003, -0.035 - 0.008 * abs(fk));
        col = mix(col, metal(uMetal, vec3(0.0, 0.3, 0.95), L, jit) * 1.2, fill(sdTaper(q, c0, c1, 0.0009, 0.0009), 0.0006));
        col = mix(col, gem(q - c1, L), fill(length(q - c1) - 0.003, 0.0007));
      }
      vec2 fq2 = q - k0;
      col = mix(col, shade(uAcc * 1.2 + 0.1, normalize(vec3(fq2 / 0.016, 0.8)), L, jit), fill(sdFlower(fq2, 0.016, 5.0), 0.001));
      col = mix(col, vec3(0.95, 0.8, 0.3), fill(length(fq2) - 0.004, 0.001));
    } else if (eq(ORNAMENT, 3.0)) {
      // hair clips on the bangs
      for (int k = 0; k < 2; k++) {
        vec2 cp = hc + vec2(-pside * (0.055 + float(k) * 0.014), 0.058 + float(k) * 0.012);
        vec2 cq = rot(-pside * 0.9) * (q - cp);
        float d = sdBox(cq, vec2(0.016, 0.0028)) - 0.001;
        col = mix(col, shade(mix(uAcc, uMetal, float(k) * 0.5), vec3(0.0, 0.5, 0.85), L, jit) + 0.05, fill(d, 0.0008));
      }
    } else if (eq(ORNAMENT, 4.0)) {
      vec2 fp = hc + vec2(pside * hr.x * 0.9, hr.y * 0.48);
      vec2 fq2 = q - fp;
      for (int k = 0; k < 2; k++) {
        float la = pside * (0.6 + float(k) * 1.2);
        vec2 lq = rot(la) * (fq2 - vec2(pside * 0.018, -0.012 + float(k) * 0.02));
        col = mix(col, shade(vec3(0.25, 0.45, 0.2), vec3(0.0, 0.3, 0.95), L, jit), fill(sdE(lq, vec2(0.018, 0.007)), 0.001));
      }
      col = mix(col, shade(uAcc * 1.15, normalize(vec3(fq2 / 0.026 * 0.5, 0.85)), L, jit), fill(sdFlower(rot(0.3) * fq2, 0.026, 5.0), 0.0012));
      col = mix(col, vec3(0.95, 0.82, 0.35), fill(length(fq2) - 0.0055, 0.001));
    }
  }

  // ---- hats
  if (eq(HAT, 1.0)) {
    // wizard hat
    float by = hc.y + hr.y * 0.72;
    vec2 brR = vec2(hr.x * 2.1, 0.032);
    float hgt = 0.27;
    col *= 1.0 - 0.45 * smoothstep(by - 0.12, by, q.y) * step(q.y, by) * smoothstep(brR.x, brR.x * 0.6, abs(q.x));
    vec2 bq = q - vec2(0.0, by);
    float dBrim = sdE(bq, brR) + 0.004 * fbm(q * 20.0 + so);
    vec3 bcol = shade(uHat, normalize(vec3(bq.x / brR.x * 0.3, 0.9, 0.4)), L, jit) * mix(0.7, 1.0, smoothstep(-0.02, 0.02, bq.y));
    col = mix(col, bcol, fill(dBrim, soft));
    float t = clamp((q.y - by) / hgt, 0.0, 1.0);
    float cx = HAT_TILT * 0.1 * t * t;
    float hw = mix(hr.x * 1.02, 0.004, pow(t, 0.9));
    float dCone = max(abs(q.x - cx) - hw, max(by - q.y, q.y - by - hgt));
    float nx = clamp((q.x - cx) / max(hw, 0.004), -1.0, 1.0);
    vec3 cn = normalize(vec3(nx * 0.9, 0.25, sqrt(1.0 - nx * nx) + 0.1));
    float cf = sin(nx * 3.0 + t * 8.0 + fbm(q * 5.0 + so) * 3.0);
    vec3 cc = shade(uHat, cn, L, jit + 0.15 * cf) * (0.92 + 0.08 * cf);
    cc = mix(cc, shade(uTrim, cn, L, jit), step(abs(t - 0.1), 0.045));
    for (int k = 0; k < 2; k++) {
      float fk = float(k);
      vec2 sq = q - vec2(cx + (fk - 0.5) * 0.04 * (1.0 - t), by + hgt * (0.35 + fk * 0.2));
      float ds = min(sdE(sq, vec2(0.011, 0.0025)), sdE(sq, vec2(0.0025, 0.011)));
      cc = mix(cc, uTrim * 1.2 + 0.1, fill(ds, 0.001));
    }
    col = mix(col, cc, fill(dCone, soft));
    col = mix(col, bcol, fill(dBrim, soft) * step(bq.y, 0.0));
  } else if (eq(HAT, 2.0)) {
    // beret
    vec2 bc2 = hc + vec2(HAT_TILT * 0.035, hr.y * 0.9);
    vec2 bq = rot(HAT_TILT * 0.22) * (q - bc2);
    vec2 bR = vec2(hr.x * 1.32, 0.064);
    float dB = sdE(bq, bR) + 0.004 * fbm(q * 18.0 + so);
    vec2 hbq = q - (hc + vec2(0.0, hr.y * 0.56));
    vec2 hbR = vec2(hr.x * 1.05, 0.022);
    float dBand = sdE(hbq, hbR);
    float dAll = min(dB, dBand);
    col *= 1.0 - 0.4 * smoothstep(0.035, 0.0, dAll) * (1.0 - fill(dAll, soft)) * step(q.y, bc2.y);
    col = mix(col, shade(uHat * 0.65, ellN(hbq, hbR), L, jit), fill(dBand, soft));
    float bf = sin(atan(bq.y, bq.x) * 7.0 + fbm(q * 6.0 + so) * 3.0);
    vec3 bn2 = normalize(ellN(bq, bR * vec2(1.0, 1.4)) + vec3(0.0, 0.4, 0.0));
    vec3 bcl = shade(uHat, bn2, L, jit + 0.15 * bf) * (0.93 + 0.07 * bf);
    bcl *= mix(0.7, 1.0, smoothstep(-bR.y, 0.0, bq.y));
    col = mix(col, bcl, fill(dB, soft));
    float dStalk = sdTaper(bq, vec2(0.0, bR.y * 0.9), vec2(0.004, bR.y + 0.016), 0.0045, 0.0028);
    col = mix(col, shade(uHat * 0.9, vec3(0.3, 0.5, 0.8), L, jit), fill(dStalk, 0.0012));
  } else if (eq(HAT, 4.0)) {
    // circlet with a gem
    float cy = 0.085 - 0.8 * fq.x * fq.x;
    float d = max(abs(fq.y - cy) - 0.0055, dHead + 0.002);
    col = mix(col, metal(uMetal, normalize(vec3(fq.x / hr.x, (fq.y - cy) / 0.011, 1.0)), L, jit), fill(d, 0.0015));
    vec2 gq = fq - vec2(0.0, 0.085);
    float dg = sdRhomb(gq, vec2(0.011, 0.017));
    col = mix(col, metal(uMetal, normalize(vec3(gq / 0.02, 0.6)), L, jit), fill(dg - 0.003, 0.0012));
    col = mix(col, gem(gq, L), fill(dg, 0.001));
    addGlow += uMagic * 0.3 * exp(-length(gq) / 0.02);
  } else if (helmet) {
    vec2 hq3 = fq - vec2(0.0, 0.02);
    vec2 hR = hr * vec2(1.13, 1.08);
    float dShell = sdE(hq3, hR);
    float dDome = max(dShell, 0.045 - fq.y);
    float dCheek = max(max(dShell, hr.x * 0.72 - abs(fq.x)), -0.085 - fq.y);
    float dNose = max(abs(fq.x) - 0.009, max(fq.y - 0.06, -0.045 - fq.y));
    float dH = min(min(dDome, dCheek), dNose);
    col *= 1.0 - 0.45 * smoothstep(-0.02, 0.045, fq.y) * fill(dHead, soft);
    vec3 hn = ellN(hq3, hR);
    vec3 hcol = metal(uMetal, hn, L, jit);
    hcol = mix(hcol, metal(uTrim, hn, L, jit), fill(abs(fq.y - 0.055) - 0.009, 0.0015));
    for (int k = 0; k < 5; k++) {
      vec2 rq = fq - vec2((float(k) - 2.0) * 0.045, 0.055);
      hcol = mix(hcol, metal(uMetal * 1.2, normalize(vec3(rq / 0.005, 0.5)), L, jit), fill(length(rq) - 0.005, 0.001));
    }
    hcol += uLight * 0.12 * smoothstep(0.012, 0.0, abs(fq.x)) * step(0.065, fq.y);
    col = mix(col, hcol, fill(dH, soft));
  } else if (eq(HAT, 6.0)) {
    // kasa: conical straw hat with a chin cord
    vec2 apex = hc + vec2(HAT_TILT * 0.012, hr.y * 1.38);
    float baseY = hc.y + hr.y * 0.55;
    float hK = apex.y - baseY;
    float wK = hr.x * 2.5;
    col *= 1.0 - 0.5 * smoothstep(baseY - 0.15, baseY, q.y) * step(q.y, baseY) * smoothstep(wK, wK * 0.6, abs(q.x - apex.x));
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      float dc = sdTaper(q, vec2(apex.x + sx * wK * 0.33, baseY - 0.01), vec2(sx * 0.03, hc.y - 0.165), 0.0016, 0.0016);
      col = mix(col, shade(uAcc * 0.8, vec3(0.0, 0.3, 0.95), L, jit), fill(dc, 0.0008));
    }
    float along = clamp((apex.y - q.y) / hK, 0.0, 1.2);
    float dTri = max(abs(q.x - apex.x) - wK * along, max(q.y - apex.y, baseY - q.y));
    float dBase = sdE(q - vec2(apex.x, baseY), vec2(wK, 0.028));
    float dK = min(dTri, dBase);
    float sa = atan(q.x - apex.x, apex.y - q.y + 0.001);
    float weave = 0.82 + 0.18 * step(0.5, fract(sa * 40.0 + step(0.5, fract(along * 18.0)) * 0.5));
    float nxk = clamp((q.x - apex.x) / max(wK * along, 0.01), -1.0, 1.0);
    vec3 kn = normalize(vec3(nxk * 0.8, 0.55, 0.6));
    vec3 kc = shade(uHat * weave, kn, L, jit);
    kc = mix(kc, shade(uHat * 0.55 * weave, vec3(0.0, -0.6, 0.8), L, jit), step(q.y, baseY) * step(0.0, -dBase));
    col = mix(col, kc, fill(dK, soft));
    col = mix(col, metal(uMetal, vec3(0.0, 0.5, 0.85), L, jit), fill(length(q - apex) - 0.008, 0.001));
  } else if (eq(HAT, 7.0)) {
    // hachimaki headband with fluttering knot tails
    float cy = 0.095 - 0.7 * fq.x * fq.x;
    float d = max(abs(fq.y - cy) - 0.011, sdE(fq - vec2(0.0, 0.02), hr * vec2(1.13, 1.08)));
    vec3 hb = shade(uAcc, normalize(vec3(fq.x / hr.x, 0.0, 1.0)), L, jit) * (0.9 + 0.1 * sin(fq.y * 300.0 + fq.x * 40.0));
    col = mix(col, hb, fill(d, 0.0015));
    float ks = -PS;
    vec2 k0 = hc + vec2(ks * hr.x * 1.05, 0.09);
    float t1 = sdTaper(q, k0, k0 + vec2(ks * 0.11, 0.02 + 0.02 * sin(uSeed)), 0.011, 0.007);
    float t2 = sdTaper(q, k0, k0 + vec2(ks * 0.09, -0.04), 0.01, 0.006);
    col = mix(col, shade(uAcc * 0.9, normalize(vec3(ks * 0.4, 0.3, 0.85)), L, jit), fill(min(t1, t2), soft));
  } else if (eq(HAT, 8.0)) {
    // kabuto: lacquered bowl, flared neck guard, gilded kuwagata crest
    float dSh = max(max(hr.x * 0.88 - abs(fq.x), abs(fq.x) - (hr.x * 1.16 + (0.06 - fq.y) * 0.45)), max(fq.y - 0.06, -0.06 - fq.y));
    col = mix(col, lamellar(fq + vec2(0.0, 0.2), normalize(vec3(sign(fq.x) * 0.5, 0.2, 0.8)), L, jit), fill(dSh, soft));
    col *= 1.0 - 0.45 * smoothstep(-0.02, 0.05, fq.y) * fill(dHead, soft);
    vec2 hq3 = fq - vec2(0.0, 0.02);
    vec2 hR = hr * vec2(1.13, 1.1);
    float dDome = max(sdE(hq3, hR), 0.05 - fq.y);
    vec3 kc = metal(uLacq, ellN(hq3, hR), L, jit);
    kc *= 1.0 - 0.3 * smoothstep(0.8, 1.0, tri(atan(hq3.x, hq3.y + 0.25) * 4.0));
    col = mix(col, kc, fill(dDome, soft));
    col = mix(col, metal(uLacq * 0.7, vec3(0.0, 0.6, 0.8), L, jit), fill(sdE(fq - vec2(0.0, 0.055), vec2(hr.x * 1.2, 0.013)), soft));
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 m0 = hc + vec2(sx * 0.008, 0.08), m1 = hc + vec2(sx * 0.05, 0.15), m2 = hc + vec2(sx * 0.075, 0.28);
      float dM = min(sdTaper(q, m0, m1, 0.008, 0.006), sdTaper(q, m1, m2, 0.006, 0.0015));
      col = mix(col, metal(vec3(0.9, 0.7, 0.3), normalize(vec3(sx * 0.4, 0.3, 0.86)), L, jit) * 1.1, fill(dM, soft));
    }
    vec2 mq = fq - vec2(0.0, 0.078);
    col = mix(col, metal(vec3(0.9, 0.7, 0.3), normalize(vec3(mq / 0.014, 0.6)), L, jit) * 1.1, fill(length(mq) - 0.014, 0.001));
    col = mix(col, uLacq * 0.6, fill(length(mq) - 0.006, 0.001));
  } else if (eq(HAT, 9.0)) {
    // feathered cap
    vec2 cc9 = hc + vec2(0.0, hr.y * 0.78);
    float fs9 = PS;
    vec2 f0 = hc + vec2(-fs9 * hr.x * 0.9, hr.y * 0.66);
    vec2 f1 = f0 + vec2(-fs9 * 0.07, 0.1), f2 = f0 + vec2(-fs9 * 0.03, 0.21);
    float dFe = min(sdTaper(q, f0, f1, 0.004, 0.017), sdTaper(q, f1, f2, 0.017, 0.002));
    float barbs = sin(dot(q - f0, normalize(vec2(fs9, 1.0))) * 500.0);
    vec3 fcol = shade(uAcc * (0.85 + 0.2 * barbs), normalize(vec3(-fs9 * 0.4, 0.3, 0.86)), L, jit);
    fcol = mix(fcol, vec3(0.9, 0.88, 0.8), fill(min(sdTaper(q, f0, f1, 0.0012, 0.0012), sdTaper(q, f1, f2, 0.0012, 0.0006)), 0.0006));
    col = mix(col, fcol, fill(dFe, soft));
    float dCap9 = min(sdE(q - cc9, vec2(hr.x * 1.12, 0.065)), sdTaper(q, cc9, cc9 + vec2(fs9 * 0.17, 0.035), 0.06, 0.004));
    dCap9 = max(dCap9, (hc.y + hr.y * 0.6) - q.y);
    col *= 1.0 - 0.4 * smoothstep(0.04, 0.0, dCap9) * (1.0 - fill(dCap9, soft)) * step(q.y, cc9.y);
    float cf9 = sin(q.x * 60.0 + fbm(q * 6.0 + so) * 3.0);
    vec3 c9 = shade(uHat, normalize(ellN(q - cc9, vec2(hr.x * 1.12, 0.065)) + vec3(0.0, 0.3, 0.0)), L, jit + 0.15 * cf9) * (0.93 + 0.07 * cf9);
    col = mix(col, c9, fill(dCap9, soft));
    float inBand = band(q.y, hc.y + hr.y * 0.6, hc.y + hr.y * 0.6 + 0.022) * fill(dCap9 - 0.004, soft);
    col = mix(col, shade(uHat * 0.65, vec3(0.0, 0.2, 0.95), L, jit), inBand);
  } else if (eq(HAT, 10.0)) {
    // fur trapper hat with ear flaps
    vec2 hq10 = fq - vec2(0.0, 0.05);
    vec2 r10 = vec2(hr.x * 1.2, hr.y * 0.85);
    float dDome = max(sdE(hq10, r10), 0.055 - fq.y);
    float dFlap = sdBox(vec2(abs(fq.x) - hr.x * 1.02, fq.y), vec2(hr.x * 0.2, 0.07)) - 0.012;
    float dF = min(dDome, dFlap) + 0.007 * fbm(q * 40.0 + so);
    col *= 1.0 - 0.45 * smoothstep(-0.02, 0.055, fq.y) * fill(dHead, soft);
    float fz = noise(vec2(atan(hq10.x, hq10.y) * 40.0, length(hq10) * 30.0) + so);
    vec3 fcol = shade(uFur * (0.75 + 0.45 * fz), normalize(ellN(hq10, r10) + vec3(0.0, 0.2, 0.0)), L, jit + 0.2 * fz);
    fcol = mix(fcol, shade(uLeather, ellN(hq10, r10), L, jit), fill(sdE(hq10 - vec2(0.0, 0.03), r10 * vec2(0.8, 0.75)), 0.004) * step(0.1, fq.y));
    col = mix(col, fcol, fill(dF, soft));
  } else if (eq(HAT, 11.0)) {
    // flower crown
    for (int k = 0; k < 7; k++) {
      float fk = float(k) - 3.0;
      float x = fk * hr.x * 0.3;
      vec2 fp = hc + vec2(x, hr.y * 0.66 - 1.3 * x * x);
      vec2 fq11 = q - fp;
      float dl = sdE(rot(fk * 0.9 + 0.5) * (fq11 - vec2(0.012, -0.004)), vec2(0.016, 0.006));
      col = mix(col, shade(vec3(0.25, 0.45, 0.2), vec3(0.0, 0.3, 0.95), L, jit), fill(dl, 0.001));
      float h = hash1(vec2(fk, uSeed));
      vec3 pc = h < 0.4 ? uAcc : (h < 0.7 ? vec3(0.95, 0.92, 0.88) : vec3(0.95, 0.75, 0.3));
      float rr = 0.015 + 0.004 * h;
      col = mix(col, shade(pc, normalize(vec3(fq11 / rr * 0.5, 0.9)), L, jit), fill(sdFlower(rot(h * 6.0) * fq11, rr, 5.0), 0.001));
      col = mix(col, vec3(0.95, 0.8, 0.3) * 0.9, fill(length(fq11) - rr * 0.25, 0.001));
    }
  }

  // ---- hood front: rim + deep shadow on the face
  if (hood) {
    float dOpen = sdE(fq - vec2(0.0, -0.035), hr * vec2(1.06, 1.08)) + 0.006 * fbm(q * 20.0 + so);
    float inOpen = fill(dOpen, 0.004);
    float sh = (1.0 - smoothstep(0.0, 0.06, -dOpen)) * 0.55 + smoothstep(-0.06, 0.13, fq.y) * 0.5;
    col *= 1.0 - clamp(sh, 0.0, 0.85) * inOpen;
    float fa = atan(fq.x, fq.y);
    float hf = sin(fa * 14.0 + fbm(q * 6.0 + so) * 4.0);
    vec3 c = shade(uCloth, ellN(fq - vec2(0.0, 0.015), hoodR), L, jit + 0.2 * hf) * (0.88 + 0.12 * hf);
    c += uLight * uCloth * 0.4 * (1.0 - smoothstep(0.0, 0.015, dOpen));
    col = mix(col, c, fill(dHoodOuter, soft) * (1.0 - inOpen));
  }

  // ---- dragon horns (poke through hair, hats and hoods)
  if (HORNS > 0.5) {
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      vec2 h0 = hc + vec2(sx * hr.x * 0.5, hr.y * 0.72);
      vec2 h1, h2;
      vec3 rr = vec3(0.022, 0.014, 0.002);
      bool antler = eq(HORNS, 4.0);
      if (eq(HORNS, 1.0)) { h1 = h0 + vec2(sx * 0.07, 0.09); h2 = h0 + vec2(sx * 0.19, 0.12); }
      else if (eq(HORNS, 2.0)) { h1 = h0 + vec2(sx * 0.035, 0.1); h2 = h0 + vec2(sx * 0.09, 0.2); }
      else if (eq(HORNS, 3.0)) { h1 = h0 + vec2(sx * 0.045, 0.045); h2 = h0 + vec2(sx * 0.028, 0.095); rr = vec3(0.016, 0.011, 0.002); }
      else { h1 = h0 + vec2(sx * 0.03, 0.1); h2 = h0 + vec2(sx * 0.06, 0.21); rr = vec3(0.012, 0.008, 0.002); }
      float d = hornD(q, h0, h1, h2, rr, sx, antler);
      vec2 e2 = vec2(0.002, 0.0);
      vec2 g = vec2(hornD(q + e2, h0, h1, h2, rr, sx, antler) - d, hornD(q + e2.yx, h0, h1, h2, rr, sx, antler) - d);
      g = normalize(g + 1e-6);
      float t = clamp(-d / 0.012, 0.0, 1.0);
      vec3 hn = normalize(vec3(g * (1.0 - t), t + 0.1));
      float tt = clamp(length(q - h0) / length(h2 - h0), 0.0, 1.0);
      vec3 hcol = mix(uHorn * 0.55, uHorn * 1.2 + 0.05, smoothstep(0.0, 1.0, tt));
      hcol *= 0.88 + 0.12 * step(0.5, fract(length(q - h0) * 60.0));
      vec3 c = shade(hcol, hn, L, jit) + uLight * 0.25 * pow(max(dot(hn, L), 0.0), 8.0);
      col = mix(col, c * mix(0.7, 1.0, smoothstep(0.0, 0.25, tt)), fill(d, soft));
    }
  }

  // ---- glowing eyes
  if (GLOW_EYES > 0.5) {
    for (int i = 0; i < 2; i++) {
      float sx = i == 0 ? -1.0 : 1.0;
      if (EYEPATCH > 0.5 && sx == pside) continue;
      vec3 eyeCol = i == 0 ? uEye2 : uEye;
      vec2 d = (fq - vec2(sx * es, 0.0)) * vec2(0.7, 1.4);
      addGlow += eyeCol * 0.5 * exp(-length(d) / 0.016);
      col = mix(col, eyeCol * 1.4 + 0.25, fill(length(fq - vec2(sx * es, 0.0)) - 0.005, 0.002) * 0.85);
    }
  }
  col += addGlow;

  // ---- finishing: brush texture, contrast, vignette, canvas weave, grain
  col *= 0.95 + 0.1 * stroke;
  col += (fbm(p * 45.0 + so) * 0.05) * vec3(1.0, 0.9, 1.1);
  col = clamp(col, 0.0, 1.0);
  col = mix(col, col * col * (3.0 - 2.0 * col), 0.3);
  col *= mix(0.3, 1.0, smoothstep(0.85, 0.2, length(p * vec2(1.1, 0.95))));
  col *= 1.0 + 0.015 * sin(gl_FragCoord.x * 1.7) * sin(gl_FragCoord.y * 1.7);
  col += (hash1(gl_FragCoord.xy + uSeed) - 0.5) * 0.035;
  gl_FragColor = vec4(col, 1.0);
}

<script>
const W = 512, H = 640;

function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hsl(h, s, l) {
  h = ((h % 1) + 1) % 1;
  const f = n => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0), f(8), f(4)];
}

const mul = (a, b) => a.map((v, i) => v * (Array.isArray(b) ? b[i] : b));

function genCharacter(seed, o = {}) {
  const h = xmur3(String(seed));
  const rng = mulberry32(h());
  let noiseSeed = (h() % 10000) / 500;
  const r = (a, b) => a + (b - a) * rng();
  const pick = a => a[Math.floor(rng() * a.length)];
  const chance = x => rng() < x;
  const wpick = opts => {
    let t = rng() * opts.reduce((s, x) => s + x[1], 0);
    for (const [v, wgt] of opts) { if ((t -= wgt) < 0) return v; }
    return opts[opts.length - 1][0];
  };
  const jit = (c, a) => c.map(v => Math.min(1, Math.max(0, v + (rng() - 0.5) * a)));

  const race = o.race || wpick([['human', 4], ['elf', 2.5], ['dragon', 2], ['duende', 2]]);
  const sex = o.sex || (chance(0.5) ? 'f' : 'm');
  const age = o.age || wpick([['young', 3.5], ['adult', 4], ['old', 2.5]]);
  const cls = o.cls || pick(['mage', 'warrior', 'ranger', 'survivor']);
  const F = sex === 'f';
  const old = age === 'old', young = age === 'young';

  // ---- colours
  const humanSkins = [[0.95,0.80,0.69],[0.89,0.69,0.55],[0.78,0.57,0.43],[0.62,0.43,0.30],[0.45,0.30,0.21],[0.32,0.21,0.15]];
  let skin = {
    human: () => pick(humanSkins),
    elf: () => pick([...humanSkins.slice(0, 3), [0.84,0.8,0.88], [0.45,0.4,0.55]]),
    dragon: () => pick([...humanSkins, [0.93,0.86,0.82]]),
    duende: () => pick([...humanSkins.slice(0, 4), [0.62,0.68,0.45], [0.72,0.55,0.45]]),
  }[race]();
  skin = jit(skin, 0.05);
  if (old) { const g = (skin[0] + skin[1] + skin[2]) / 3; skin = mix(skin, [g, g, g], 0.2); }

  const scale = jit(pick([[0.7,0.15,0.12],[0.72,0.48,0.2],[0.2,0.55,0.35],[0.2,0.38,0.7],[0.9,0.72,0.3],[0.18,0.17,0.22],[0.85,0.86,0.92],[0.5,0.3,0.7]]), 0.05);

  const naturals = [[0.08,0.06,0.05],[0.22,0.13,0.07],[0.42,0.17,0.07],[0.72,0.56,0.32],[0.55,0.35,0.18]];
  const fantasy = [[1.0,0.48,0.68],[0.6,0.45,0.85],[0.3,0.7,0.75],[0.85,0.87,0.92],[0.2,0.25,0.5],[0.7,0.12,0.1]];
