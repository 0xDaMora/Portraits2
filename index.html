  if (race === 'duende' && chance(0.3)) hair = pick([[0.75,0.3,0.1],[0.9,0.5,0.15]]);
  if (race === 'dragon' && chance(0.3)) hair = mix(scale, [0.05, 0.05, 0.05], 0.25);
  if (old) hair = mix(hair, pick([[0.78,0.77,0.75],[0.9,0.9,0.88],[0.55,0.55,0.55]]), r(0.7, 1));
  else if (age === 'adult' && chance(0.2)) hair = mix(hair, [0.7, 0.7, 0.7], 0.35);
  hair = jit(hair, 0.04);

  // ---- class kit
  const kit = {
    mage: () => ({
      outfit: wpick([[0, 3], [4, 1.5]]),
      hat: wpick([[1, 3], [2, 1.5], [4, 1.5], [3, 1.2], [11, F ? 1.2 : 0.4], [6, 0.3], [0, 1.2]]),
      prop: wpick([[1, 3], [7, 1.5], [8, 1.5], [0, 1]]),
      amulet: chance(0.6),
    }),
    warrior: () => {
      const outfit = wpick([[1, 3], [5, 2]]);
      const samurai = outfit === 5;
      return {
        outfit,
        hat: samurai ? wpick([[8, 3], [7, 2], [0, 2]]) : wpick([[5, 2.5], [7, 1], [4, 0.7], [0, 3]]),
        prop: wpick([[2, samurai ? 0.5 : 2], [4, samurai ? 4 : 1], [6, 1.5], [10, 1], [9, 1], [0, 1]]),
        amulet: chance(0.15),
      };
    },
    ranger: () => ({
      outfit: wpick([[2, 3], [4, 1]]),
      hat: wpick([[3, 3], [9, 2], [6, 1.2], [7, 0.8], [0, 2.5]]),
      prop: wpick([[3, 2.5], [5, 2], [4, 0.7], [10, 0.5], [0, 1]]),
      amulet: chance(0.2),
    }),
    survivor: () => ({
      outfit: 3,
      hat: wpick([[3, 2], [10, 2], [6, 1], [7, 1], [0, 3]]),
      prop: wpick([[9, 2], [10, 1.5], [2, 1], [5, 1], [3, 0.8], [0, 2]]),
      amulet: chance(0.25),
    }),
  }[cls]();

  const cloth = {
    mage: () => hsl(pick([0.6, 0.66, 0.75, 0.83, 0.0, 0.45, 0.95]) + r(-0.02, 0.02), r(0.35, 0.6), r(0.22, 0.38)),
    warrior: () => hsl(pick([0.0, 0.6, 0.33, 0.12]), r(0.4, 0.6), r(0.25, 0.35)),
    ranger: () => hsl(pick([0.25, 0.3, 0.08, 0.1, 0.55]), r(0.2, 0.4), r(0.2, 0.3)),
    survivor: () => hsl(pick([0.07, 0.09, 0.25, 0.33, 0.0, 0.6]), r(0.18, 0.4), r(0.18, 0.32)),
  }[cls]();
  const trim = pick([[0.85,0.68,0.32],[0.8,0.8,0.82],[0.85,0.82,0.75],[0.6,0.2,0.2],[0.12,0.12,0.14]]);
  const magic = pick([[0.4,0.8,1.0],[0.8,0.45,1.0],[1.0,0.6,0.25],[0.5,1.0,0.6],[1.0,0.45,0.7]]);
  const metalC = pick([[0.62,0.64,0.68],[0.85,0.65,0.3],[0.7,0.45,0.25],[0.32,0.32,0.36]]);
  const leather = jit([0.35, 0.21, 0.12], 0.08);
  const horn = pick([[0.85,0.8,0.68],[0.2,0.18,0.2],[0.55,0.42,0.3],[0.9,0.75,0.4], mix(scale, [0, 0, 0], 0.3)]);
  const fur = jit(pick([[0.42,0.33,0.24],[0.55,0.53,0.5],[0.8,0.78,0.74],[0.25,0.2,0.16]]), 0.06);
  const paint = pick([[0.6,0.12,0.08],[0.15,0.3,0.6],[0.85,0.83,0.78],[0.06,0.05,0.05]]);
  let acc = pick([[0.75,0.15,0.15],[0.9,0.88,0.85],[0.95,0.55,0.7],[0.9,0.7,0.3],[0.4,0.65,0.9],[0.12,0.12,0.14],[0.55,0.35,0.8],[0.3,0.6,0.35]]);
  const lacq = pick([[0.5,0.08,0.06],[0.09,0.08,0.08],[0.12,0.16,0.32],[0.12,0.25,0.18]]);
  const lip = F ? mix(mul(skin, [1.0, 0.7, 0.72]), [0.72, 0.3, 0.38], 0.35) : mul(skin, [1.05, 0.8, 0.8]);

  // ---- eyes
  const glowEyes = chance(race === 'dragon' ? 0.15 : cls === 'mage' ? 0.12 : 0.03);
  const natEyes = [[0.35,0.22,0.1],[0.25,0.45,0.25],[0.25,0.45,0.7],[0.6,0.45,0.15],[0.45,0.45,0.45]];
  const fantEyes = [[0.55,0.35,0.8],[0.3,0.7,0.6],[0.8,0.25,0.3],[0.95,0.7,0.2]];
  const dragonEyes = [[1.0,0.75,0.2],[1.0,0.45,0.15],[0.85,0.2,0.2],[0.5,0.9,0.3],[0.4,0.8,1.0],[0.7,0.4,1.0]];
  let eye;
  if (glowEyes) eye = pick([[0.3,0.9,1.0],[1.0,0.55,0.15],[0.6,1.0,0.4],[0.8,0.45,1.0]]);
  else if (race === 'dragon') eye = pick(dragonEyes);
  else if (race === 'elf') eye = pick([...natEyes, ...fantEyes]);
  else eye = pick(chance(0.15) ? fantEyes : natEyes);
  const hetero = chance(0.07);
  const eye2 = hetero ? pick([...natEyes, ...fantEyes, ...dragonEyes]) : eye;

  const lightType = cls === 'mage' ? wpick([['arcane', 5], ['fire', 3], ['moon', 2]]) : wpick([['fire', 5], ['moon', 3], ['arcane', 2]]);
  let light, lightAng;
  if (lightType === 'fire') {
    light = [1.0, 0.58, 0.26];
    lightAng = pick([r(-0.7, -0.2), r(-2.9, -2.4), r(0.3, 0.9), r(2.2, 2.8)]);
  } else if (lightType === 'moon') {
    light = [0.55, 0.72, 1.0];
    lightAng = pick([r(0.6, 1.2), r(1.9, 2.5)]);
  } else {
    light = mix(magic, [1, 1, 1], 0.2);
    lightAng = pick([r(0.3, 1.2), r(1.9, 2.8)]);
  }
  const bg = hsl(r(0, 1), r(0.2, 0.4), r(0.18, 0.3));

  // ---- shape and accessories
  const headW = { human: r(0.92, 1.06), elf: r(0.86, 0.96), dragon: r(0.92, 1.04), duende: r(1.08, 1.2) }[race] * (F ? 0.96 : 1.02);
  const jawBase = { human: r(0.15, 0.3), elf: r(0.3, 0.4), dragon: r(0.18, 0.32), duende: r(0.2, 0.32) }[race];
  const eyeBase = { human: r(0.9, 1.1), elf: r(1.05, 1.2), dragon: r(0.95, 1.12), duende: r(1.2, 1.4) }[race];
  const noseBase = { human: r(0.9, 1.15), elf: r(0.8, 0.95), dragon: r(0.85, 1.05), duende: r(1.5, 1.9) }[race];

  const hairStyle = F
    ? wpick([[2, 2], [4, 1.5], [5, 1], [6, 1.5], [7, 1.5], [8, 1.2], [10, 1.2], [3, 1], [1, 0.6], [12, 1.2], [9, 0.3]])
    : wpick([[1, 3], [9, 2], [7, 1], [11, 1.2], [2, 1], [3, 0.6], [0, old ? 2.5 : 0.4], [10, 0.3], [12, 0.4]]);
  const beardP = race === 'elf' ? 0.08 : race === 'dragon' ? 0.2 : young ? 0.15 : 0.5;

  let mark = 0;
  if (cls === 'survivor' && chance(0.45)) mark = 1 + Math.floor(rng() * 3);
  else if (cls === 'ranger' && chance(0.2)) mark = 1 + Math.floor(rng() * 3);
  else if (race === 'elf' && chance(0.3)) mark = 5;
  else if (cls === 'mage' && chance(0.25)) mark = 4;

  const glasses = chance(cls === 'mage' ? (old ? 0.3 : 0.1) : 0.03) ? wpick([[1, 2], [2, old ? 2 : 0.7]]) : 0;
  const mask = chance({ ranger: 0.22, survivor: 0.15, warrior: 0.05, mage: 0.02 }[cls]);

  const p = {
    headW,
    headH: r(0.95, 1.07) * (race === 'duende' ? 0.95 : 1),
    jaw: jawBase + (F ? 0.1 : 0) + (young ? 0.03 : 0),
    eyeSep: r(0.046, 0.055) * headW,
    eyeSize: eyeBase * (F ? 1.06 : 1) * (young ? 1.05 : old ? 0.94 : 1),
    hairStyle, hairLen: r(0.3, 1),
    beard: !F && chance(beardP) ? r(0.25, 1) : 0,
    scar: chance(cls === 'warrior' || cls === 'survivor' ? 0.35 : 0.1) ? 1 : 0,
    mark,
    lightAng,
    browTilt: r(-0.006, 0.008),
    mouthW: r(0.028, 0.038) * headW,
    ear: { human: 0, elf: 1, duende: 2, dragon: wpick([[0, 2], [1, 2], [3, 1]]) }[race],
    glowEyes: glowEyes ? 1 : 0,
    part: r(-1, 1),
    mouthCurve: r(-1, 3),
    hairVol: r(0.95, 1.1),
    female: F ? 1 : 0,
    age: { young: r(0, 0.2), adult: r(0.3, 0.5), old: r(0.75, 1) }[age],
    race: RACE_ID[race],
    outfit: kit.outfit, hat: kit.hat, prop: kit.prop,
    amulet: kit.amulet ? 1 : 0,
    earrings: chance(F ? 0.5 : 0.15) ? 1 : 0,
    nose: noseBase * (F ? 0.9 : 1),
    bodyW: (race === 'duende' ? 0.82 : 1) * (F ? 0.9 : 1),
    horns: race === 'dragon' ? wpick([[1, 3], [2, 2], [3, 2], [4, 1.5]]) : 0,
    freckles: chance(young ? 0.35 : 0.12) ? 1 : 0,
    hatTilt: r(-1, 1),
    propSide: chance(0.5) ? 1 : -1,
    fur: kit.outfit === 3 && chance(0.6) ? 1 : 0,
    ahoge: chance(young ? 0.3 : 0.15) ? 1 : 0,
    ornament: 0,
    eyeShape: wpick([[0, 3], [1, 1.5], [2, 1.2], [3, F ? 2 : 0.8], [4, 0.8]]),
    pupil: race === 'dragon' ? (chance(0.8) ? 1 : 0) : (cls === 'mage' && chance(0.08) ? 2 : 0),
    eyepatch: !glasses && chance(cls === 'warrior' || cls === 'survivor' ? 0.1 : 0.02) ? 1 : 0,
    glasses,
    mask: mask ? 1 : 0,
    scarf: chance({ survivor: 0.4, ranger: 0.3, warrior: 0.08, mage: 0.08 }[cls]) ? 1 : 0,
    scales: race === 'dragon' ? r(0.6, 1) : 0,
    fang: chance({ dragon: 0.5, duende: 0.25, human: 0.08, elf: 0.05 }[race]) ? 1 : 0,
    mole: chance(0.15) ? 1 : 0,
    pattern: 0,
    hetero: hetero ? 1 : 0,
  };
  Object.assign(p, o.set || {});

  // ---- things that depend on the (possibly overridden) choices above
  if (p.outfit === 4 && chance(0.7)) p.pattern = 1 + Math.floor(rng() * 3);
  if (p.hairStyle !== 0 && chance(F ? 0.55 : 0.06)) {
    const hs = p.hairStyle;
    if (hs === 3 || hs === 5) p.ornament = wpick([[2, 3], [1, 1], [4, 1]]);
    else if (hs === 6 || hs === 7) p.ornament = wpick([[1, 3], [3, 1], [4, 0.5]]);
    else p.ornament = wpick([[1, 1.5], [2, 1.2], [3, 1.5], [4, 1.2]]);
  }
  if (p.hat === 7) acc = pick([[0.9,0.88,0.85],[0.75,0.15,0.15],[0.12,0.12,0.14]]);
  let hatC;
  if (p.hat === 6) hatC = chance(0.7) ? jit([0.78, 0.64, 0.38], 0.05) : [0.12, 0.1, 0.1];
  else if (p.hat === 9) hatC = hsl(pick([0.25, 0.3, 0.08, 0.0]), r(0.3, 0.5), r(0.2, 0.32));
  else if (p.hat === 10) hatC = fur;
  else if ((p.hat === 1 || p.hat === 2) && cls === 'mage' && chance(0.5)) hatC = hsl(r(0, 1), r(0.3, 0.55), r(0.2, 0.35));
  else hatC = mul(cloth, 0.85);

  const colors = { skin, hair, cloth, trim, hat: hatC, bg, eye, eye2, light, paint, metal: metalC, leather, magic, lip, horn, fur, scale, acc, lacq };
  Object.assign(colors, o.colors || {});

  const np = NAME_PARTS[race];
  let name = pick(np.a) + pick(F ? np.f : np.m);
  let lt = lightType;
  if (o.pin) {
    Object.assign(p, o.pin.p);
    Object.assign(colors, o.pin.colors);
    noiseSeed = o.pin.noiseSeed;
    name = o.pin.name;
    lt = o.pin.lightType;
  }
  const hs = HAIR_STYLES[p.hairStyle];
  p.fringe = hs.fringe;
  p.sideIn = hs.sideIn || 0.84;
  p.sideLen = hs.side ? hs.side(p.hairLen) : 0;
  p.back = hs.back || 0;
  p.extra = hs.extra || 0;
  if (p.female || p.mask) p.beard = 0;
  if (p.hairStyle === 0) { p.ornament = 0; p.ahoge = 0; }
  if (!p.hetero) colors.eye2 = colors.eye;

  const g = F ? 1 : 0;
  const traits = [LABELS.age[age][g], hs.name];
  if (HATS[p.hat]) traits.push(HATS[p.hat]);
  traits.push(LABELS.outfit[p.outfit]);
  for (const k of ['prop', 'ornament', 'glasses', 'pattern', 'horns', 'mark']) if (LABELS[k][p[k]]) traits.push(LABELS[k][p[k]]);
  if (p.eyeShape) traits.push(LABELS.eyeShape[p.eyeShape]);
  if (LABELS.pupil[p.pupil]) traits.push(LABELS.pupil[p.pupil]);
  const flags = [['scales', 'Escamas'], ['amulet', 'Amuleto'], ['earrings', 'Pendientes'], ['beard', 'Barba'], ['mask', 'Máscara ninja'],
    ['scarf', 'Bufanda'], ['eyepatch', 'Parche'], ['ahoge', 'Ahoge'], ['fang', 'Colmillo'], ['mole', 'Lunar'], ['freckles', 'Pecas'],
    ['scar', 'Cicatriz'], ['hetero', 'Heterocromía'], ['glowEyes', 'Ojos brillantes'], ['fur', 'Cuello de piel']];
  for (const [k, label] of flags) if (p[k]) traits.push(label);
  traits.push('Luz: ' + { fire: 'hoguera', moon: 'luna', arcane: 'arcana' }[lt]);

  const Q = new Float32Array(52);
  PARAMS.forEach((k, i) => { Q[i] = p[k]; });

  return { name, title: `${LABELS.cls[cls][g]} · ${LABELS.race[race][g]}`, traits, Q, noiseSeed, colors };
}

};
const DRAGON_SEEDS = ['ryu', 'kaen', 'hisui', 'shiro', 'kuro', 'tatsu'];

const glc = document.createElement('canvas');
glc.width = W; glc.height = H;
const gl = glc.getContext('webgl', { preserveDrawingBuffer: true });
let prog;
const uloc = {};
const uName = k => 'u' + k[0].toUpperCase() + k.slice(1);

function initGL() {
  if (!gl) throw new Error('WebGL no está disponible en este navegador.');
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}'));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, W, H);
  for (const n of ['uRes', 'uSeed', 'uQ', ...COLOR_KEYS.map(uName)]) uloc[n] = gl.getUniformLocation(prog, n);
}

function renderTo(canvas, seed, overrides) {
  const ch = genCharacter(seed, overrides);
  gl.uniform2f(uloc.uRes, W, H);
  gl.uniform1f(uloc.uSeed, ch.noiseSeed);
  gl.uniform4fv(uloc.uQ, ch.Q);
  for (const k of COLOR_KEYS) gl.uniform3fv(uloc[uName(k)], ch.colors[k]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  canvas.getContext('2d').drawImage(glc, 0, 0, canvas.width, canvas.height);
  return ch;
}

const $ = id => document.getElementById(id);
const randomSeed = () => Math.random().toString(36).slice(2, 8);
const SELECTS = { race: 'selRace', sex: 'selSex', age: 'selAge', cls: 'selCls', hair: 'selHair', hat: 'selHat' };
let activePreset = null;

HAIR_STYLES.forEach((s, i) => $('selHair').add(new Option(s.name, i)));
HATS.forEach((s, i) => $('selHat').add(new Option(s || 'Sin sombrero', i)));

function selectOverrides() {
  const o = {}, set = {};
  for (const k of ['race', 'sex', 'age', 'cls']) if ($(SELECTS[k]).value) o[k] = $(SELECTS[k]).value;
  if ($('selHair').value !== '') set.hairStyle = +$('selHair').value;
  if ($('selHat').value !== '') set.hat = +$('selHat').value;
  o.set = set;
  return o;
}

function presetOverrides(name, variant, extra = { set: {} }) {
  const pr = PRESETS[name];
  const o = { ...pr.base, race: variant.race, ...extra, set: { ...pr.set, ...extra.set }, colors: pr.colors };
  const untouched = !Object.keys(extra).some(k => k !== 'set') && !Object.keys(extra.set).length;
  if (variant.pin && untouched) o.pin = variant.pin;
  return o;
}

function currentOverrides() {
  const o = selectOverrides();
  return activePreset ? presetOverrides(activePreset.name, activePreset.variant, o) : o;
}

function show(seed) {
  $('seed').value = seed;
  const ch = renderTo($('big'), seed, currentOverrides());
  $('name').textContent = ch.name;
  $('race').textContent = ch.title;
  $('traits').innerHTML = '';
  for (const t of ch.traits) {
    const li = document.createElement('li');
    li.textContent = t;
    $('traits').appendChild(li);
  }
  $('presetTag').style.display = activePreset ? 'block' : 'none';
  if (activePreset) $('presetName').textContent = PRESETS[activePreset.name].label;
  const hp = new URLSearchParams({ seed });
  for (const [k, id] of Object.entries(SELECTS)) if ($(id).value !== '') hp.set(k, $(id).value);
  if (activePreset) { hp.set('preset', activePreset.name); hp.set('variant', activePreset.variant.seed); }
  history.replaceState(null, '', '#' + hp.toString());
}

function thumb(container, seed, overrides, onClick) {
  const div = document.createElement('div');
  div.className = 'frame thumb';
  const c = document.createElement('canvas');
  c.width = 256; c.height = 320;
  div.appendChild(c);
  const label = document.createElement('div');
  label.className = 'seed';
  div.appendChild(label);
  div.onclick = () => { onClick(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  container.appendChild(div);
  const ch = renderTo(c, seed, overrides);
  label.textContent = `${seed} · ${ch.title}`;
}

function clearSelects() { for (const id of Object.values(SELECTS)) $(id).value = ''; }

function usePreset(name, variant) {
  activePreset = { name, variant };
  clearSelects();
  show(variant.seed);
}

function fillPresetGallery() {
  const g = $('presetGallery');
  g.innerHTML = '';
  for (const v of PRESETS['maga-rosa'].variants) thumb(g, v.seed, presetOverrides('maga-rosa', v), () => usePreset('maga-rosa', v));
}

function fillDragonGallery() {
  const g = $('dragonGallery');
  g.innerHTML = '';
  for (const seed of DRAGON_SEEDS) {
    thumb(g, seed, { race: 'dragon', set: {} }, () => { activePreset = null; clearSelects(); $('selRace').value = 'dragon'; show(seed); });
  }
}

function fillGallery() {
  const g = $('gallery');
  g.innerHTML = '';
  const o = selectOverrides();
  for (let i = 0; i < 12; i++) {
    const seed = randomSeed();
    thumb(g, seed, o, () => { activePreset = null; show(seed); });
  }
}

try {
  initGL();
  const hp = new URLSearchParams(location.hash.slice(1));
  for (const [k, id] of Object.entries(SELECTS)) if (hp.get(k) !== null) $(id).value = hp.get(k);
  const pr = PRESETS[hp.get('preset')];
  if (hp.get('seed')) {
    const variant = pr && pr.variants.find(v => v.seed === hp.get('variant'));
    activePreset = variant ? { name: hp.get('preset'), variant } : null;
    show(hp.get('seed'));
  } else {
    usePreset('maga-rosa', PRESETS['maga-rosa'].variants[0]);
  }
  fillPresetGallery();
  fillDragonGallery();
  fillGallery();
} catch (e) {
  $('name').innerHTML = '<span class="err">Error</span>';
  $('race').textContent = e.message;
  console.error(e);
}

$('go').onclick = () => show($('seed').value.trim() || randomSeed());
$('seed').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('rand').onclick = () => { activePreset = null; show(randomSeed()); };
$('more').onclick = fillGallery;
$('clearPreset').onclick = () => { activePreset = null; show($('seed').value); };
for (const id of Object.values(SELECTS)) $(id).onchange = () => { show($('seed').value); fillGallery(); };
$('dl').onclick = () => {
  const a = document.createElement('a');
  a.download = 'retrato-' + $('seed').value + '.png';
  a.href = $('big').toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
